:root{
  --bg:#f7f2ec; --p1:#fffaf4; --p2:#f0e8de; --p3:#e6dccf; --line:#d9ccbb;
  --txt:#241a2e; --mut:#6b5d7a; --dim:#9a8ca8;
  --acc:#d93f32; --acc2:#b8700a; --tune:#0f8a80; --onacc:#ffffff;
  --ok:#17995f; --mid:#b57a00; --bad:#c62828; --vio:#7a4bd1; --pink:#c2318a;
  --disp:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --r1:4px; --r2:10px; --r3:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14101a; --p1:#1c1625; --p2:#251d31; --p3:#30263f; --line:#392d4a;
    --txt:#f3eef8; --mut:#a396b8; --dim:#6f6485;
    --acc:#ff6a5c; --acc2:#ffb347; --tune:#4fd1c5; --onacc:#1a0f14;
    --ok:#3ddc97; --mid:#f5b83a; --bad:#ef5350; --vio:#b58cff; --pink:#ff7ac0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14101a; --p1:#1c1625; --p2:#251d31; --p3:#30263f; --line:#392d4a;
  --txt:#f3eef8; --mut:#a396b8; --dim:#6f6485;
  --acc:#ff6a5c; --acc2:#ffb347; --tune:#4fd1c5; --onacc:#1a0f14;
  --ok:#3ddc97; --mid:#f5b83a; --bad:#ef5350; --vio:#b58cff; --pink:#ff7ac0; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-inline:16px;padding-block:14px 96px}
.wrap{max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:800;letter-spacing:.01em;text-wrap:balance}
h2{font-size:24px;line-height:1.1;margin-bottom:10px}
p{margin:0 0 8px}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.mut{color:var(--mut)} .dim{color:var(--dim)} .small{font-size:14px} .tiny{font-size:12.5px}
.up{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--mut)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{font-family:var(--disp);font-weight:900;font-size:28px;line-height:1;letter-spacing:.02em}
.brand i{font-style:normal;color:var(--acc)}
.v1{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tune);border:1px solid var(--tune);border-radius:99px;padding:2px 8px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:var(--r3);padding:14px;margin-bottom:12px}
.card.flat{background:var(--p2)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.wk{font-family:var(--disp);font-weight:900;font-size:104px;line-height:.78;color:var(--acc);min-width:76px;text-align:center}
.wk small{display:block;font-size:13px;letter-spacing:.14em;color:var(--mut);margin-top:8px;font-weight:800}
.hero h1{font-size:28px;line-height:1.02;margin:2px 0 6px}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--p3);color:var(--mut);border-radius:99px;padding:3px 9px}
.gauge{margin-top:10px}
.gauge svg{width:100%;height:auto;display:block}
.gauge .cap{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mut)}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.daynav button{min-width:44px;min-height:44px;border-radius:var(--r2);background:var(--p2);font-family:var(--disp);font-weight:900;font-size:20px}
.daynav .mid{flex:1;text-align:center;min-width:0}
.daynav .mid b{display:block;font-family:var(--disp);font-size:20px;font-weight:800;line-height:1.1}
.sem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sem button{background:var(--p2);border:2px solid transparent;border-radius:var(--r2);padding:10px 8px;text-align:left;min-height:64px}
.sem button b{display:block;font-family:var(--disp);font-size:18px;font-weight:800;line-height:1.1}
.sem button span{font-size:12.5px;color:var(--mut);line-height:1.2;display:block;margin-top:2px}
.sem button.on[data-s="g"]{border-color:var(--ok)} .sem button.on[data-s="y"]{border-color:var(--mid)} .sem button.on[data-s="r"]{border-color:var(--bad)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.dot.g{background:var(--ok)} .dot.y{background:var(--mid)} .dot.r{background:var(--bad)}
.blk{background:var(--p1);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:8px;overflow:hidden}
.blk.done{border-color:var(--ok)}
.blk summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;min-height:56px}
.blk summary::-webkit-details-marker{display:none}
.tick{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:700;color:transparent;background:var(--p2)}
.blk.done .tick{background:var(--ok);border-color:var(--ok);color:var(--onacc)}
.blk .tt{flex:1;min-width:0}
.blk .tt b{display:block;font-family:var(--disp);font-weight:800;font-size:20px;line-height:1.1}
.blk .tt span{font-size:13px;color:var(--mut)}
.blk .mn{font-family:var(--disp);font-weight:800;font-size:18px;color:var(--mut);white-space:nowrap}
.blk .body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.blk ol{margin:10px 0;padding-left:20px}
.blk li{margin-bottom:6px}
.note{border-left:3px solid var(--acc2);background:var(--p2);border-radius:0 var(--r2) var(--r2) 0;padding:8px 12px;margin:8px 0;font-size:15px}
.note.t{border-color:var(--tune)} .note.w{border-color:var(--bad)}
.note b{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:99px;background:var(--p3);font-weight:700}
.btn.pri{background:var(--acc);color:var(--onacc);font-family:var(--disp);font-size:20px;font-weight:800;letter-spacing:.02em}
.btn.tune{background:var(--tune);color:var(--onacc)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--mut)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cta{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.cta .btn{width:100%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats>div{background:var(--p2);border-radius:var(--r2);padding:10px 4px;text-align:center;min-width:0}
.stats .v{font-family:var(--disp);font-weight:900;font-size:32px;line-height:1}
.stats .l{font-size:11.5px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.map{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1;border-radius:var(--r1);background:var(--p2);display:grid;place-items:center;font-size:10px;color:var(--dim);font-weight:700;min-width:0}
.cell.g{background:var(--ok);color:var(--onacc)} .cell.y{background:var(--mid);color:var(--onacc)} .cell.r{background:var(--bad);color:var(--onacc)} .cell.rest{background:var(--p3);color:var(--mut)}
.cell.now{outline:2px solid var(--acc);outline-offset:1px}
.strip{display:flex;gap:3px;align-items:flex-end;height:64px;overflow-x:auto;padding-bottom:2px}
.strip i{flex:0 0 9px;border-radius:2px 2px 0 0;background:var(--ok);min-height:2px}
.strip i.e{background:var(--p3)} .strip i.n{outline:2px solid var(--acc)}
.phase{margin-bottom:14px}
.phase h3{font-size:22px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.phase h3 span{font-size:13px;font-weight:700;color:var(--mut);font-family:var(--body);letter-spacing:.06em}
.wrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--p1);border:1px solid var(--line);border-radius:var(--r2);padding:8px 10px;margin-top:6px;min-height:52px}
.wrow.now{border-color:var(--acc)}
.wrow .n{flex:0 0 40px;font-family:var(--disp);font-weight:900;font-size:24px;color:var(--acc);text-align:center}
.wrow .t{flex:1;min-width:0}
.wrow .t b{display:block;font-weight:700;line-height:1.2}
.wrow .t span{font-size:13px;color:var(--mut)}
.pips{display:flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--p3)}
.pips i.g{background:var(--ok)} .pips i.y{background:var(--mid)} .pips i.r{background:var(--bad)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--p1);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:640px}
.tabs button{min-height:52px;border-radius:var(--r2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--mut);font-size:12px;font-weight:700;min-width:0}
.tabs button .ic{font-size:20px;line-height:1}
.tabs button.on{background:var(--p3);color:var(--txt)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.seg button{flex:0 0 auto;min-height:40px;padding:6px 14px;border-radius:99px;background:var(--p2);font-weight:700;color:var(--mut)}
.seg button.on{background:var(--tune);color:var(--onacc)}
.big{font-family:var(--disp);font-weight:900;font-size:64px;line-height:1}
.note-name{font-family:var(--disp);font-weight:900;font-size:72px;line-height:1;text-align:center;color:var(--tune)}
input[type=range]{width:100%;accent-color:var(--tune)}
input[type=date],select{font:inherit;background:var(--p2);color:var(--txt);border:1px solid var(--line);border-radius:var(--r2);padding:8px 10px;min-height:44px}
.ans{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.ans button{min-height:56px;border-radius:var(--r2);background:var(--p2);font-family:var(--disp);font-weight:800;font-size:20px;border:2px solid transparent}
.ans button.ok{border-color:var(--ok);background:var(--p3)} .ans button.no{border-color:var(--bad)}
.solf{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.solf span{min-width:52px;padding:10px 6px;border-radius:var(--r2);background:var(--p2);text-align:center;font-family:var(--disp);font-weight:900;font-size:22px;color:var(--mut)}
.solf span.hi{background:var(--tune);color:var(--onacc);transform:scale(1.08)}
.lib{display:block}
.lib summary{cursor:pointer}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--p2);border-radius:99px;padding:6px 12px;margin:0 6px 6px 0;font-size:14px;font-weight:600}
.badge.off{opacity:.4;filter:grayscale(1)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;max-width:608px;margin:0 auto;background:var(--txt);color:var(--bg);border-radius:var(--r2);padding:12px 14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.timer{font-variant-numeric:tabular-nums}
/* ── semana (inspirada en Cabra Furiosa) ── */
.wkhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.wkhead .t{text-align:center;min-width:0}
.wkhead .t b{font-family:var(--disp);font-weight:800;font-size:22px;display:block;line-height:1.1}
.wkhead .t span{font-size:13px;color:var(--mut)}
.nbtn{flex:0 0 auto;width:44px;height:44px;border-radius:var(--r2);background:var(--p2);font-size:22px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{position:relative;padding:8px 2px 12px;border-radius:var(--r2);background:var(--p2);text-align:center;min-height:86px;--ec:var(--dim);transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.day .dw{display:block;font-size:11.5px;font-weight:700;color:var(--mut)}
.day .dd{font-size:12px;color:var(--dim)}
.day .L{font-family:var(--disp);font-weight:900;font-size:30px;line-height:1;margin:4px 0 2px;color:var(--ec)}
.day .bar{position:absolute;left:6px;right:6px;bottom:4px;height:3px;border-radius:2px;background:var(--ec);opacity:.7}
.day.done{background:color-mix(in srgb,var(--ec) 24%,var(--p2));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ec) 60%,transparent)}
.day.done .dw,.day.done .dd{color:var(--txt)}
.day.done .bar{opacity:1;height:4px}
.day .ok{position:absolute;top:3px;right:5px;font-size:10px;font-weight:900;color:var(--ec)}
.day.miss{opacity:.5} .day.fut .L{opacity:.6}
.day.sel{transform:translateY(-3px);box-shadow:inset 0 0 0 2px var(--txt)}
.day.today .dw{color:var(--acc)}
.t-T{--ec:var(--acc)} .t-O{--ec:var(--tune)} .t-E{--ec:var(--acc2)} .t-R{--ec:var(--vio)} .t-C{--ec:var(--pink)} .t-S{--ec:var(--dim)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--mut);margin-top:10px}
.legend b{font-family:var(--disp);font-weight:900;font-size:15px;margin-right:2px;color:var(--ec)}
/* ── micro y resultados ── */
.tuner{text-align:center}
.tuner .nm{font-family:var(--disp);font-weight:900;font-size:68px;line-height:1}
.cbar{position:relative;height:30px;margin:8px 0}
.cbar .tr{position:absolute;left:0;right:0;top:13px;height:4px;border-radius:2px;background:var(--p3)}
.cbar .ctr{position:absolute;left:50%;top:3px;width:2px;height:24px;background:var(--dim)}
.cbar .nd{position:absolute;top:2px;width:8px;height:26px;margin-left:-4px;border-radius:4px;background:var(--dim);left:50%}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
canvas.trace{width:100%;height:210px;display:block;border-radius:var(--r2);background:var(--p2)}
.res{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.res .nt{flex:1 1 54px;min-width:54px;border-radius:var(--r2);padding:6px 4px;text-align:center;background:var(--p2);border-bottom:4px solid var(--dim)}
.res .nt b{display:block;font-family:var(--disp);font-size:20px;line-height:1.1}
.res .nt span{font-size:13px;font-weight:700}
.res .nt.g{border-color:var(--ok)} .res .nt.y{border-color:var(--mid)} .res .nt.r{border-color:var(--bad)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.solf span small{display:block;font-family:var(--body);font-size:11px;font-weight:600;opacity:.8;line-height:1}
.solf span b{font-weight:900}

@media (max-width:420px){.wk{font-size:84px;min-width:60px}.hero h1{font-size:24px}.stats .v{font-size:28px}}
</style>

<script>
"use strict";
/* ═════════ DATOS: FASES, SEMANAS, EJERCICIOS ═════════ */
const PHASES = [
  {n:"Cimientos", a:1, b:8, d:"Postura, aire y un sonido sano. Aún no pretendemos sonar bien: pretendemos no hacernos daño."},
  {n:"Oído y afinación", a:9, b:16, d:"Escalas, intervalos y bordón. Se acabó cantar 'por ahí cerca'."},
  {n:"Registros y puente", a:17, b:26, d:"Pecho, cabeza, falsete y el cruce entre ellos: la mezcla."},
  {n:"Resonancia y timbre", a:27, b:34, d:"Vocales, brillo y espacio. Tu voz, con carácter propio."},
  {n:"Estilo y expresión", a:35, b:44, d:"Dinámica, fraseo y los cinco mundos: Sheeran, M-Clan, Revólver, Anís y Silvio."},
  {n:"Escenario y repertorio", a:45, b:52, d:"Resistencia, canciones enteras, micro y concierto final."}
];

const E = {
 bostezo:{n:"Bostezo-suspiro",c:"Calentar",m:2,
  s:["Bosteza (si no sale, finge: es contagioso incluso contigo mismo).","En la exhalación, deja caer un suspiro sonoro «haaah» de nota media a grave.","5 veces, cada una más suave y larga que la anterior."],
  t:"Si en mitad del ejercicio bostezas de verdad, enhorabuena: has hackeado tu faringe.",
  w:"El bostezo abre la faringe y baja la laringe de forma natural: más espacio para resonar, menos cuello en tensión.",
  x:"Empujar el suspiro con la garganta. Debe caer solo, como un globo con fuga lenta.",
  p:["5 suspiros en tu rango cómodo","5 suspiros empezando más agudo","Suspiro desde falsete hasta pecho"]},
 masaje:{n:"Soltar mandíbula, lengua y cuello",c:"Calentar",m:2,
  s:["Con las yemas, masajea 20 s las articulaciones de la mandíbula (delante de las orejas).","Saca la lengua hacia abajo y di «aaa» 5 veces sin que se tense la base.","Gira el cuello despacio y deja caer los hombros 3 veces."],
  t:"La mandíbula es como el cinturón tras un cocido: si no la sueltas, la voz no respira.",
  w:"Lengua y mandíbula comparten músculos con el hioides, del que cuelga la laringe. Tensión ahí = laringe atrapada.",
  x:"Abrir la boca al máximo de golpe. Abre lo justo para meter un dedo grueso de lado.",
  p:["2 min, sin sonido forzado","2 min, añade «ah» relajado","2 min, hazlo mientras hablas en voz alta"]},
 resp:{n:"Respiración costal 4-4-8",c:"Aire y apoyo",m:3,
  s:["De pie, manos en las costillas bajas como un cinturón. Inhala 4 s por la nariz: las costillas se abren hacia los lados.","Sostén 4 s sin cerrar la garganta (como si fueras a decir «ah»).","Suelta 8 s con un «ssss» uniforme. 4 rondas."],
  t:"Si te suben los hombros al inhalar, eso no es respiración, es un encogimiento de «yo qué sé».",
  w:"Cantar es mantener una presión subglótica estable mientras sale aire. Respirar bien es tu regulador de presión, como el de una botella de buceo.",
  x:"Subir los hombros o hinchar solo el vientre y quedarte rígido. Costillas y vientre, en equipo.",
  p:["4-4-8, 4 rondas","4-4-12, 4 rondas","4-2-16 con «ssss» que no tiembla"]},
 straw:{n:"Pajita (SOVT)",c:"Calentar",m:4,
  s:["Con una pajita, sopla y suena en una nota cómoda: «uuu» a través de ella.","Haz un glissando suave de grave a medio y vuelve, sin cortar el sonido.","Opcional: mete la pajita 2 cm en un vaso con agua y haz burbujitas mientras suenas."],
  t:"Cantar con pajita parece cosa de cumpleaños, pero es lo que usan los laboratorios de voz. Cero vergüenza.",
  w:"Semi-ocluir el tracto sube la presión en la boca, que «empuja de vuelta» sobre las cuerdas: vibran con menos choque. Es un amortiguador acústico: cambias la impedancia del tracto.",
  x:"Soplar fuerte. La pajita no es un trombón.",
  p:["3 min, glissando suave","4 min, glissando de 1 octava","5 min, frases de canción con la pajita"]},
 trino:{n:"Trino de labios",c:"Calentar",m:3,
  s:["Labios sueltos, como un caballo: «brrr» con sonido sobre una nota cómoda.","Sube y baja en sirena de 5 notas sin que se pare el trino.","Si se corta, sostén las mejillas con los dedos."],
  t:"Si sale saliva, es normal. Eres un instrumento húmedo.",
  w:"Como la pajita, es SOVT. Además necesitas flujo de aire constante: es un chivato de tu apoyo.",
  x:"Hacer el trino con la mandíbula tensa.",
  p:["Nota fija, 30 s","Sirena de 5 notas","Escala mayor entera ascendiendo y descendiendo"]},
 hum:{n:"Hum en «m» y «ng»",c:"Calentar",m:3,
  s:["Labios cerrados, dientes sueltos, «mmm» en nota media. Debes notar cosquillas en labios y nariz.","Cambia a «ng» (el final de «sing») con la lengua pegada al paladar.","Escala de 5 notas subiendo y bajando sobre el hum."],
  t:"Sin cosquillas en la cara no hay resonancia: sube un poco la nota y sonríe.",
  w:"Con la boca cerrada el sonido se canaliza por la nariz: resonancia de «máscara» con muy poco esfuerzo de cuerdas.",
  x:"Apretar los labios. Ciérralos como si sujetaras un hilo, no una moneda.",
  p:["Nota fija, 3 s × 5","Escala de 5 notas","Frases de canción con hum"]},
 sirena:{n:"Sirena vocal",c:"Calentar",m:3,
  s:["Sobre «ng» u «oo», desliza de grave a agudo y baja, como una sirena.","Sin saltos: el sonido es continuo, suaviza los cambios de registro.","3 sirenas, cada una un poco más amplia, sin forzar."],
  t:"Tú, que eres bombero, ya sabes de sirenas. Ahora, que estén afinadas.",
  w:"Recorre toda tu tesitura sin pararte, calentando toda la musculatura y ensayando los cambios de registro de forma continua.",
  x:"Gritar al llegar arriba. El techo no es un objetivo, es una consecuencia.",
  p:["3 sirenas suaves","3 sirenas de 1,5 octavas","3 sirenas con crescendo y diminuendo"]},
 onset:{n:"Ataque suave",c:"Aire y apoyo",m:4,
  s:["Di «ha» sin empujar y cántalo: el sonido empieza sin golpe ni aire de más.","Compara con «ah» golpeado y con «hhha» aireado. Busca el punto medio.","5 notas, 3 repeticiones cada una, nota larga de 3 s."],
  t:"Imagina que dejas un vaso de cristal sobre la mesa: sin golpe, sin arrastrarlo.",
  w:"El ataque define cómo se cierran las cuerdas: golpe de glotis, aireado o simultáneo. El simultáneo es el eficiente.",
  x:"Empezar con un «clic» en la garganta.",
  p:["5 notas, nota larga de 3 s","Con vocales a-e-i-o-u","Cambiando de nota sin repetir el ataque"]},
 stac:{n:"Staccato de apoyo",c:"Aire y apoyo",m:3,
  s:["Manos en la cintura: «ha-ha-ha-ha-ha» en una nota, cortito, con un pulso de abdomen cada una.","Que cada «ha» arranque limpio e igual al anterior.","Hazlo en 5 notas de escala, ascendente."],
  t:"Son burpees con el diafragma, pero sin sudar.",
  w:"Entrena el control fino del aire: el cuerpo aprende a dosificar la presión golpe a golpe.",
  x:"Golpear en la garganta en vez de en el abdomen.",
  p:["Nota fija, 5 golpes","5 notas, 1 golpe por nota","Escala completa, tempo 100"]},
 mdv:{n:"Messa di voce",c:"Aire y apoyo",m:4,
  s:["Nota larga: empieza muy suave (pp), crece hasta mf y vuelve a pp en 10 s.","Sin cambiar afinación ni timbre: solo volumen.","3 repeticiones en 3 notas diferentes."],
  t:"Es el ejercicio favorito de los profesores de ópera y el que más enseña sobre ti. Y sí, cuesta.",
  w:"Subir el volumen sin que la nota suba o baje exige coordinar presión de aire y tensión de las cuerdas: control puro.",
  x:"Dejar que la nota se desafine al crecer. Escucha el desvío.",
  p:["6 s, 3 notas","8 s, 5 notas","10 s, pasando por tu cambio de registro"]},
 esc5:{n:"Escala de 5 notas",c:"Afinación",m:4,
  s:["Elige una nota cómoda en la app (Oído → Diapasón).","Canta 1-2-3-4-5-4-3-2-1 sobre «mi-a-mi» o «nay».","Sube un semitono cada vez hasta notar el límite cómodo y baja."],
  t:"No se trata de llegar alto, sino de pasar por cada nota sin resbalar.",
  w:"Cinco notas contiguas son un laboratorio de afinación: tono, tono, semitono, tono. Un semitono son 100 cents; tu oído aprende a medirlos.",
  x:"Cantar fuerte para «asegurar» la nota.",
  p:["Sílaba «mi», tempo lento (60 bpm)","«nay» y «ma», 80 bpm","Con legato y dinámica creciente"]},
 escmay:{n:"Escala mayor con solfeo",c:"Afinación",m:5,
  s:["En la app (Oído → Escalas) elige una nota de partida y activa el bordón.","Canta Do-Re-Mi-Fa-Sol-La-Si-Do y baja, nombrando las notas (do móvil: el Do es la nota de partida, sea cual sea).","Después cántala con «a», sin nombres."],
  t:"El solfeo no es cosa de colegio: es darle a tu cerebro un nombre para cada altura.",
  w:"Do móvil: cada grado tiene función (el Do reposa, el Sol tira hacia el Do, el Si pide resolver). Cantar funciones sirve más que memorizar notas.",
  x:"Ir rápido. Primero lento y limpio.",
  p:["Subida lenta con bordón","Ida y vuelta, 80 bpm, sin bordón","Salta grados: 1-3-2-4-3-5…"]},
 arpe:{n:"Arpegio 1-3-5-3-1",c:"Afinación",m:4,
  s:["Canta Do-Mi-Sol-Mi-Do sobre «mi-a-mi-a-mi».","Imagina la nota antes de cantarla (audiación) y compruébala con el bordón.","Sube un semitono cada ronda."],
  t:"Medio repertorio de Sheeran y M-Clan son arpegios disfrazados. Aprende el disfraz.",
  w:"Los arpegios son acordes desplegados. La tercera decide si suena mayor o menor, y el oído de cualquiera la pilla.",
  x:"Cantar la tercera baja (plana): la gente lo nota aunque no sepa decir por qué.",
  p:["Tempo lento con bordón","Sin bordón, 3 tonalidades","Añade la 8ª: 1-3-5-8-5-3-1"]},
 pent:{n:"Pentatónica",c:"Afinación",m:4,
  s:["Canta 1-2-3-5-6-5-3-2-1 (Do-Re-Mi-Sol-La) sobre «a».","Haz variaciones: salta notas, repite, cambia el ritmo.","Improvisa 8 compases solo con esas 5 notas sobre el bordón."],
  t:"Es la escala de «no hay notas feas»: por eso la usan el pop y el blues. La autopista de la melodía.",
  w:"Sin semitonos no hay choques con el acorde: terreno seguro para improvisar.",
  x:"Quedarse siempre en el mismo patrón. Cambia ritmo y orden.",
  p:["Subir y bajar, 70 bpm","Con variaciones y saltos","Improvisa 8 compases"]},
 menor:{n:"Escala menor y color",c:"Afinación",m:4,
  s:["Canta la menor natural (La-Si-Do-Re-Mi-Fa-Sol-La) sobre el bordón.","Compárala con la mayor: nota el color triste del tercer grado.","Canta una frase de 4 notas en menor y la misma en mayor."],
  t:"Un semitono de diferencia y de repente suena a despedida en el aeropuerto.",
  w:"La tercera menor está a 300 cents y la mayor a 400: ese solo semitono cambia el carácter emocional.",
  x:"Cantar la tercera «a medias». Define si es una u otra.",
  p:["Subida lenta","Ida y vuelta sin bordón","Frases en mayor y menor alternadas"]},
 bordon:{n:"Cantar contra un bordón",c:"Afinación",m:5,
  s:["En Oído → Escalas, activa el bordón de tu nota de partida.","Canta la tónica y siente cómo «se funde» con el bordón; luego quinta y tercera.","Canta una melodía simple (Cumpleaños feliz) sobre el bordón."],
  t:"Cuando clavas la nota, el batido desaparece y todo suena «más grande».",
  w:"Dos frecuencias ligeramente distintas producen batidos a |f1−f2|. Si coinciden, el batido desaparece. Física pura aplicada a tu garganta.",
  x:"Imitar al bordón sin escucharlo. Escucha cómo cambia cuando te desvías.",
  p:["Tónica y quinta","Tónica, tercera y quinta","Melodía completa sobre el bordón"]},
 salt:{n:"Saltos limpios (audiación)",c:"Afinación",m:4,
  s:["Elige dos notas con salto de 3ª, 4ª o 5ª. Escúchalas en la app.","Canta la primera, imagina la segunda en silencio y luego cántala.","Comprueba con el tono de la app: ¿clavada, alta o baja?"],
  t:"Primero la oreja, luego la boca. Cantar sin oír antes es disparar a ciegas.",
  w:"El cerebro predice la altura antes de que las cuerdas la produzcan (bucle audio-vocal). Este ejercicio entrena justo ese bucle.",
  x:"Tantear la nota con un deslizamiento hacia arriba: el «rascar» típico del principiante.",
  p:["3ª, 4ª y 5ª","Añade 6ª y octava","Saltos descendentes y al azar"]},
 gliss:{n:"Glissando y aterrizaje",c:"Afinación",m:3,
  s:["Desliza de una nota a otra en 2 s y aterriza en la meta sin corregir.","Comprueba el aterrizaje con el diapasón de la app.","Repite con distancias mayores."],
  t:"Si aterrizas bien al primer intento, tu cerebro midió la distancia. Si no, calibra y repite.",
  w:"Entrena el control continuo de la tensión de las cuerdas: la afinación es una función continua, no un conjunto de escalones.",
  x:"Pasarse de la nota y volver.",
  p:["Intervalos de 3ª y 5ª","Octavas","Con los ojos cerrados"]},
 pecho:{n:"Voz de pecho: «mum» y «gug»",c:"Registros",m:4,
  s:["Sobre «mum» o «gug», di una frase hablada en tu zona grave-media y luego cántala.","Mantén la nota con voz plena pero sin presionar.","Sube por semitonos hasta notar que hay que «empujar»: ahí paras."],
  t:"Hablar con voz de pecho es normal. Cantarla bien es hablar con calma y proyección.",
  w:"En el mecanismo de pecho vibra casi toda la masa de la cuerda: voz oscura y potente en grave y medio.",
  x:"Subir con voz «pesada» más allá de lo cómodo: así se agota una voz.",
  p:["Frases habladas y cantadas","Escala de 5 notas","Escala de 8 notas sin forzar"]},
 cabeza:{n:"Voz de cabeza: «oo» ligero",c:"Registros",m:4,
  s:["Sobre «oo», sirena suave hasta una nota aguda cómoda.","Mantén la nota 3 s con sonido fino pero firme.","Repite con «ee» y «ah» cuidando que no se escape aire."],
  t:"Piensa en cantar «por encima de la cabeza», no «a golpe de cuello».",
  w:"En cabeza se estiran las cuerdas (cricotiroideo): pierden masa y suben de frecuencia, como estirar una goma.",
  x:"Subir apretando cuello y lengua.",

/* ═════════ UTILIDADES ═════════ */
const $ = s => document.querySelector(s);
const DAY = 86400000;
const DOW = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DTYPE = ["Técnica","Oído","Técnica + estilo","Oído + técnica","Registro y color","Canción","Suave"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ymd(d){ const z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
function parseYmd(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtDay(d){ return d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"}); }
function phaseOf(w){ return PHASES.findIndex(p => w>=p.a && w<=p.b); }
function pick(a, i){ return a[((i%a.length)+a.length)%a.length]; }

/* ═════════ ESTADO + PERSISTENCIA ═════════ */
const KEY = "voz-furiosa-v1";
let S = null;
let cloud = null, cloudSaveT = null;

function freshState(){
  const t = new Date(); t.setHours(0,0,0,0);
  // El día 1 es el lunes de esta semana (el plan está pensado L→D)
  const dow = (t.getDay()+6)%7;
  const mon = new Date(t.getTime() - dow*DAY);
  return { v:1, start: ymd(mon), days:{}, lab:{ cents:0, centsBest:0, centsStreak:0, tries:0, hits:0, ivl:0, ivlStreak:0, ivlTries:0, ivlHits:0, lo:null, hi:null, takes:[] }, ts:Date.now() };
}
function loadLocal(){
  try { const r = localStorage.getItem(KEY); if (r){ const o = JSON.parse(r); if (o && o.v===1){ o.lab=o.lab||{}; o.lab.takes=o.lab.takes||[]; return o; } } } catch(e){}
  return null;
}
function save(){
  S.ts = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  if (cloud){ clearTimeout(cloudSaveT); cloudSaveT = setTimeout(() => { cloud.set({json: JSON.stringify(S), ts: S.ts}).catch(()=>{}); }, 700); }
}
async function initCloud(){
  try{
    if (!(window.claude && claude.use)) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.collection("data/users/"+id).doc("vozfuriosa");
    const snap = await ref.get();
    cloud = ref;
    if (snap.exists){
      const d = snap.data();
      if (d && d.json && d.ts > S.ts){ try { const o = JSON.parse(d.json); if (o && o.v===1){ o.lab=o.lab||{}; o.lab.takes=o.lab.takes||[]; S = o; try{localStorage.setItem(KEY, JSON.stringify(S));}catch(e){} render(); } } catch(e){} }
      else if (d && d.ts < S.ts) save();
    } else {
      save();
    }
  }catch(e){}
}

/* ═════════ PLAN: construir el día ═════════ */
function todayIdx(){ const t=new Date(); t.setHours(0,0,0,0); return Math.round((t - parseYmd(S.start))/DAY); }
function idxDate(i){ return new Date(parseYmd(S.start).getTime() + i*DAY); }

function buildDay(idx){
  const wi = Math.floor(idx/7), dow = idx%7, w = wi+1;
  const wk = W[wi]; const [title, focus, K, ref] = wk;
  const ph = phaseOf(w);
  const warmPool = ph===0 ? ["bostezo","masaje","resp"] : ["straw","trino","hum","sirena"];
  let warm = pick(warmPool, wi*7+dow);
  const used = new Set();
  const B = [];
  const add = (ex, core, kind, extra) => { if (used.has(ex) && kind!=="lab") return; used.add(ex); B.push(Object.assign({id:B.length, ex, core, kind:kind||"ex"}, extra||{})); };
  const labDrill = ph===0 ? pick(["diap","hold","esc"], wi+dow) : pick(["esc","cents","esc","ivl","hold"], wi+dow);
  if (dow===6){
    add("straw",true); add("escucha",true); add("enfri",true);
  } else {
    if (K.includes(warm)) warm = pick(warmPool, wi*7+dow+1);
    add(warm,true);
    const k0=K[0], k1=K[1], k2=K[2];
    if (dow===0){ add(k0,true); add(k1,false); }
    if (dow===1){ add("lab",true,"lab",{drill:labDrill}); add(k1,false); }
    if (dow===2){ add(k0,true); add(k2,false); }
    if (dow===3){ add(k1,true); add("lab",false,"lab",{drill:labDrill}); }
    if (dow===4){ add(k2,true); add(k0,false); }
    if (dow===5){ add(k0,true); add((w%4===0)?"rec":"song",true); if (w%4!==0) {} }
    add("enfri",true);
  }
  const sorted = B.filter(b=>true);
  // la sesión de cuidado final siempre al último
  const ci = sorted.findIndex(b=>b.ex==="enfri"); if (ci>=0 && ci!==sorted.length-1){ sorted.push(sorted.splice(ci,1)[0]); }
  sorted.forEach((b,i)=>b.id=i);
  const lvl = (()=>{ const p=PHASES[ph]; const len=p.b-p.a+1; const r=(w-p.a)/len; return r<.34?0:(r<.67?1:2); })();
  return { idx, w, wi, dow, title, focus, ref, ph, lvl, type:DTYPE[dow], blocks:sorted };
}

function D(i){ return S.days[i]; }
function okDay(i){ const d=D(i); return !!(d && (d.done || d.rest)); }
function streak(){
  const t = todayIdx(); let i = Math.min(t, 363), n = 0;
  if (i<0) return 0;
  if (!okDay(i)) i--;
  while (i>=0 && okDay(i)){ if (D(i).done) n++; i--; }
  return n;
}
function totals(){
  const t = Math.min(todayIdx(), 363);
  let done=0, ok=0, mins=0;
  for (let i=0;i<=t;i++){ const d=D(i); if (d&&d.done){ done++; ok++; mins += d.mins||0; } else if (d&&d.rest) ok++; }
  const adh = t>=0 ? Math.round(100*ok/(t+1)) : 0;
  return {done, adh, mins};
}

/* ═════════ AUDIO ═════════ */
let AC=null, masterG=null;
function ac(){
  if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); masterG = AC.createGain(); masterG.gain.value=.9; masterG.connect(AC.destination);}catch(e){} }
  if (AC && AC.state==="suspended") AC.resume();
  return AC;
}
const mf = m => 440*Math.pow(2,(m-69)/12);
const NN = ["Do","Do♯","Re","Re♯","Mi","Fa","Fa♯","Sol","Sol♯","La","La♯","Si"];
const mname = m => NN[((m%12)+12)%12] + (Math.floor(m/12)-1);
function tone(freq, when, dur, vol){
  const a = ac(); if (!a) return;
  vol = vol==null ? .22 : vol;
  const t0 = a.currentTime + when;
  const g = a.createGain(); g.connect(masterG);
  [[1,"sine",1],[2,"sine",.28],[3,"sine",.1]].forEach(([mul,type,amp])=>{
    const o = a.createOscillator(); o.type=type; o.frequency.value=freq*mul;
    const og = a.createGain(); og.gain.value=amp; o.connect(og); og.connect(g);
    o.start(t0); o.stop(t0+dur+.05);
  });
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+.03);
  g.gain.setValueAtTime(vol,t0+Math.max(.06,dur-.15));
  g.gain.linearRampToValueAtTime(0.0001,t0+dur);
}
let drone = null;
function droneOn(m){
  droneOff(); const a=ac(); if(!a) return;
  const g=a.createGain(); g.gain.value=0; g.connect(masterG);
  const os=[mf(m-12), mf(m-12+7)].map((f,i)=>{ const o=a.createOscillator(); o.type="triangle"; o.frequency.value=f; const og=a.createGain(); og.gain.value=i?0.5:1; o.connect(og); og.connect(g); o.start(); return o; });
  g.gain.linearRampToValueAtTime(.16,a.currentTime+.4);
  drone={g,os};
}
function droneOff(){
  if(!drone||!AC) { drone=null; return; }
  const {g,os}=drone; g.gain.linearRampToValueAtTime(0.0001,AC.currentTime+.25);
  setTimeout(()=>os.forEach(o=>{try{o.stop();}catch(e){}}),300); drone=null;
}

function gauge(prog){
  // aguja de afinador: -50¢ (semana 0) → 0¢ (semana 52)
  const x0=20, x1=300, W_=x1-x0;
  const ticks=[]; for(let c=-50;c<=50;c+=10){ const x=x0+(c+50)/100*W_; const big=c%50===0||c===0; ticks.push(`<line x1="${x}" y1="${big?10:16}" x2="${x}" y2="26" stroke="var(--dim)" stroke-width="${c===0?2.5:1.2}"/>${c%50===0||c===0?`<text x="${x}" y="8" text-anchor="middle" font-size="9" fill="var(--mut)">${c>0?"+":""}${c}¢</text>`:""}`); }
  const cents = Math.round(-50*(1-prog));
  const nx = x0 + (cents+50)/100*W_;
  const col = cents>=-5 ? "var(--ok)" : (cents>=-25 ? "var(--mid)" : "var(--acc)");
  return `<div class="gauge"><svg viewBox="0 0 320 52" role="img" aria-label="Afinador: ${cents} cents de desviación respecto al objetivo">

   <rect x="${x0}" y="26" width="${Math.max(0,nx-x0)}" height="3" rx="1.5" fill="${col}"/>

  </svg><div class="cap"><span>Desafinación residual</span><b class="num" style="color:${col}">${cents>0?"+":""}${cents} ¢</b></div></div>`;
}

function toMono11k(data, fs){
  const f=Math.max(1,Math.round(fs/11025)), n=Math.floor(data.length/f), out=new Float32Array(n);
  for(let i=0;i<n;i++){ let s=0; for(let k=0;k<f;k++) s+=data[i*f+k]; out[i]=s/f; }
  return {x:out, fs:fs/f};

const REC={stream:null,src:null,proc:null,z:null,chunks:[],tail:null,fs:44100,from:0,t0:0,timer:null,last:0};
function onChunk(ev){

  const T=REC.tail; T.copyWithin(0,inp.length); T.set(inp.subarray(Math.max(0,inp.length-T.length)),T.length-Math.min(inp.length,T.length));

  if(nd){ nd.style.left=(50+Math.max(-50,Math.min(50,c)))+"%"; nd.style.background=Math.abs(c)<=15?"var(--ok)":(Math.abs(c)<=30?"var(--mid)":"var(--bad)"); }
}
async function micStart(key){

function micCard(){ return `<div class="card"><div class="up">Tu turno · feedback de afinación</div>${micPanel("tab")}</div>`; }
function resultHTML(r,key){

  const q=v=>Math.abs(v)<=15?"g":(Math.abs(v)<=30?"y":"r"), sg=v=>(v>0?"+":"")+Math.round(v);
  const hold=r.kind==="hold";
  let h=`<div class="stats" style="margin:12px 0"><div><div class="v num">±${Math.round(r.avg)}</div><div class="l">¢ media</div></div>
    <div><div class="v num">${hold?Math.round(100*r.ok/r.n)+"%":r.ok+"/"+r.n}</div><div class="l">en ±25 ¢</div></div>
    <div><div class="v num">${sg(r.bias)}</div><div class="l">sesgo ¢</div></div>
    <div><div class="v num">${Math.round(r.spread)}</div><div class="l">${hold?"inestab.":"dispers."}</div></div></div>
    <canvas class="trace" data-k="${key}" role="img" aria-label="Trazo de afinación de tu toma frente a las notas objetivo"></canvas>
    <div class="tiny mut" style="margin:4px 0 10px">Líneas: notas objetivo · puntos: <span style="color:var(--ok)">●</span> ±25 ¢ <span style="color:var(--mid)">●</span> ±50 ¢ <span style="color:var(--bad)">●</span> fuera</div>`;
  if(!hold) h+=`<div class="res">${r.notes.slice(0,30).map(n=>`<div class="nt ${n.miss?"":q(n.err)}"><b>${esc(n.lb)}</b><span>${n.miss?"—":sg(n.err)+" ¢"}</span></div>`).join("")}</div>`;
  h+=r.tips.map(t=>`<div class="note ${t.k||""}"><b>${esc(t.h)}</b>${esc(t.b)}</div>`).join("");
  return h+`<button class="btn ghost" data-a="resclear" data-k="${key}">Nueva toma</button>`;
}

   <p class="small mut" style="margin:10px 0 0">${esc(streakLine(n))}</p></div>`;

  h+=`<div class="card"><h2>Mapa de constancia</h2><div class="tiny mut" style="margin-bottom:6px">L M X J V S D · últimas 8 semanas</div><div class="map">`;
  for(let w=first;w<first+8&&w<52;w++){ for(let k=0;k<7;k++){ const i=w*7+k; const d=D(i); let cl=""; if(d&&d.done) cl=d.sem==="y"?"y":"g"; else if(d&&d.rest) cl="rest";
    h+=`<div class="cell ${cl}${i===ti?" now":""}" title="${esc(fmtDay(idxDate(i)))}">${k===0?w+1:""}</div>`; } }
  h+=`</div></div>`;
  // tira 52 semanas
  h+=`<div class="card"><h2>52 semanas</h2><div class="strip">`;
  for(let w=0;w<52;w++){ let c=0; for(let k=0;k<7;k++) if(okDay(w*7+k)) c++; const hh=Math.max(2,Math.round(c/7*60)); h+=`<i class="${c?"":"e"}${w===cw?" n":""}" style="height:${hh}px" title="Semana ${w+1}: ${c}/7"></i>`; }
  h+=`</div><div class="tiny mut" style="margin-top:6px">Altura = días cumplidos esa semana.</div></div>`;
  // insignias
  const L=S.lab;
  const bad=[["🔥","Primer día",t.done>=1],["🧨","Trío caliente (3 seguidos)",n>=3],["⚡","Semana de hierro (7)",n>=7],["🌶","Quincena (14)",n>=14],["👑","Mes inquebrantable (30)",n>=30],["🎯","10 sesiones",t.done>=10],["🎤","50 sesiones",t.done>=50],["🏔","100 sesiones",t.done>=100],["👂","Oído: ±25 ¢",L.centsBest>=3],["🎻","Oído: ±10 ¢",L.centsBest>=5],["🧭","Intervalos nivel 4",L.ivl>=3],["🎙","Primera toma analizada",(L.takes||[]).length>=1],["🎼","Toma de ±15 ¢",(L.takes||[]).some(t=>t.avg<=15)],["📈","10 tomas",(L.takes||[]).length>=10]];
  h+=`<div class="card"><h2>Insignias</h2>${bad.map(([i,nm,ok])=>`<span class="badge ${ok?"":"off"}">${i} ${esc(nm)}</span>`).join("")}</div>`;
  const tk=(L.takes||[]).slice(-24);
  h+=`<div class="card"><h2>Afinación en el tiempo</h2>`+(tk.length?`<div class="strip" style="height:84px">${tk.map(t=>`<i style="flex-basis:14px;height:${Math.max(4,Math.round(Math.min(60,t.avg)/60*80))}px;background:${t.avg<=15?"var(--ok)":(t.avg<=30?"var(--mid)":"var(--bad)")}" title="${esc(t.name)}: ±${t.avg} ¢"></i>`).join("")}</div><div class="tiny mut" style="margin-top:6px">Altura = desviación media (¢) por toma; más bajo, más afinado. Mejor: ±${Math.min(...(L.takes||[]).map(t=>t.avg))} ¢ · ${(L.takes||[]).length} tomas.</div>`:`<p class="small mut">Aún no hay tomas. Haz una en la pestaña Escalas y verás aquí cómo baja tu desviación.</p>`)+`</div>`;
  // ajustes
  h+=`<div class="card flat"><div class="up">Ajustes</div><p class="small mut" style="margin:6px 0">Día 1 del plan (un lunes, para que el plan cuadre con la semana):</p>

   <button class="btn ghost" data-a="reset">${UI.confirmReset?"Pulsa otra vez para borrar todo":"Borrar progreso"}</button></div>`;
  return h;

function setSem(i,s){ const d=S.days[i]||(S.days[i]={blocks:{}}); d.sem=s; if(!d.blocks) d.blocks={}; save(); render(); }
function stopTimer(){ if(UI.timer){ clearInterval(UI.timer.h); UI.timer=null; } }
function startTimer(key, mins){
  stopTimer(); UI.timer={key,left:mins*60,h:setInterval(()=>{
    UI.timer.left--; document.querySelectorAll('[data-timer="'+UI.timer.key+'"]').forEach(el=>el.textContent=fmtT(UI.timer.left));
    if(UI.timer.left<=0){ const a=ac(); if(a){tone(880,0,.25,.2);tone(1175,.3,.4,.2);} stopTimer(); toast("¡Tiempo! Marca el bloque como hecho."); render(); }
  },1000)};
}
function playNote(){ droneOff(); tone(mf(UI.note),0,2.2); }

function newHunt(){
  const L=S.lab, levels=[100,60,40,25,15,10,5];
  const lo=L.lo!=null?L.lo:55, hi=L.hi!=null?Math.max(L.hi,lo+4):72;
  const base=lo+Math.floor(Math.random()*Math.max(1,hi-lo-2)); const dir=Math.random()<.5?"up":"down"; const c=levels[L.cents]*(dir==="up"?1:-1);
  UI.hunt={base,dir,c,ans:null}; playHunt();
}
function playHunt(){ const h=UI.hunt; droneOff(); const f1=mf(base0(h)); tone(f1,0,.9); tone(f1*Math.pow(2,h.c/1200),1.2,.9); }
function base0(h){ return h.base; }
function newIvl(){
  const sets=[[7,12],[4,7,12],[3,4,5,7,12],[1,2,3,4,5,7,12]]; const set=sets[S.lab.ivl];
  const sem=set[Math.floor(Math.random()*set.length)]; const base=50+Math.floor(Math.random()*14);
  UI.ivl={sem,base,ans:null}; playIvl();
}
function playIvl(){ const v=UI.ivl; droneOff(); tone(mf(v.base),0,.9); tone(mf(v.base+v.sem),1.1,.9); }

let schedT=[];
function stopScale(){ schedT.forEach(clearTimeout); schedT=[]; UI.playing=false; UI.hi=-1; markScale(-1); }
function playScale(){
  const seq=scaleSeq(), beat=60/UI.bpm; stopScale(); UI.playing=true;
  if(UI.withDrone) droneOn(UI.root); else droneOff();
  seq.forEach((n,k)=>{
    schedT.push(setTimeout(()=>{ if(!UI.playing) return; tone(mf(UI.root+n.s),0,beat*.92); UI.hi=n.i; markScale(n.i); },k*beat*1000));
  });
  schedT.push(setTimeout(()=>{ UI.playing=false; UI.hi=-1; render(); },seq.length*beat*1000+250));
  render();
}

function act(a, el){
  const ds = el.dataset;
  if(UI.mic.phase==="rec" && ["tab","pickday","wk","week","day","lab","gotoscale"].includes(a)) micStop();
  switch(a){
    case "tab": stopScale(); droneOff(); UI.withDrone=false; UI.tab=ds.t; if(ds.t==="hoy") UI.view=Math.min(Math.max(todayIdx(),0),363); render(); window.scrollTo(0,0); break;
    case "day": UI.view=Math.min(363,Math.max(0,(UI.view||0)+ +ds.d)); stopTimer(); render(); window.scrollTo(0,0); break;
    case "week": UI.view=(+ds.w)*7; UI.tab="hoy"; render(); window.scrollTo(0,0); break;
    case "sem": setSem(+ds.i, ds.s); break;
    case "tick": {
      const i=+ds.i, b=+ds.b; const d=S.days[i]||(S.days[i]={blocks:{}}); if(!d.blocks) d.blocks={};
      if(i>todayIdx()){ toast("Ese día aún no toca. Disfruta la vista previa."); break; }
      d.blocks[b]=!d.blocks[b]; save(); render(); break; }
    case "close": {
      const i=+ds.i; const d=S.days[i]; if(!d) break; const day=buildDay(i);
      const vb=visBlocks(day,d.sem); let m=0; vb.forEach(b=>{ if(d.blocks[b.id]) m+=blockMins(b); });
      d.done=true; d.mins=m; d.ts=Date.now(); save(); render();
      toast(pick(FUNNY_DONE,i)+" Racha: "+streak()+"."); window.scrollTo(0,0); break; }
    case "rest": { const i=+ds.i; const d=S.days[i]||(S.days[i]={blocks:{}}); d.rest=true; d.sem="r"; save(); render(); toast(pick(FUNNY_REST,i)); break; }
    case "reopen": { const i=+ds.i; const d=S.days[i]; if(d){ d.done=false; d.rest=false; } save(); render(); break; }
    case "timer": if(UI.timer&&UI.timer.key===ds.key) stopTimer(); else startTimer(ds.key,+ds.m); render(); break;
    case "gotolab": UI.tab="oido"; UI.lab=ds.l; render(); window.scrollTo(0,0); break;
    case "lab": stopScale(); droneOff(); UI.withDrone=false; UI.lab=ds.l; UI.res.tab=null; render(); break;
    case "nudge": UI.note=Math.min(84,Math.max(36,UI.note+ +ds.n)); render(); playNote(); break;
    case "play": playNote(); break;
    case "setlo": S.lab.lo=UI.note; save(); render(); break;
    case "sethi": S.lab.hi=UI.note; save(); render(); break;
    case "hunt": if(UI.hunt&&!UI.hunt.ans) playHunt(); else { newHunt(); render(); } break;
    case "huntans": {
      const h=UI.hunt; if(!h||h.ans) break; h.ans=ds.v; const L=S.lab; L.tries++;
      if(ds.v===h.dir){ L.hits++; L.centsStreak++; if(L.centsStreak>=3&&L.cents<6){ L.cents++; L.centsStreak=0; if(L.cents>L.centsBest) L.centsBest=L.cents; toast("Nivel nuevo: ±"+[100,60,40,25,15,10,5][L.cents]+" ¢"); } }
      else { L.centsStreak=0; L.cents=Math.max(0,L.cents-(L.tries%2?0:1)); }
      save(); render(); break; }
    case "ivl": if(UI.ivl&&UI.ivl.ans==null) playIvl(); else { newIvl(); render(); } break;
    case "ivlans": {
      const v=UI.ivl; if(!v||v.ans!=null) break; v.ans=+ds.v; const L=S.lab; L.ivlTries++;
      if(v.ans===v.sem){ L.ivlHits++; L.ivlStreak++; if(L.ivlStreak>=5&&L.ivl<3){ L.ivl++; L.ivlStreak=0; toast("Intervalos: nivel "+(L.ivl+1)+"/4"); } }
      else L.ivlStreak=0;
      save(); render(); break; }
    case "scaleplay": if(UI.playing){ stopScale(); droneOff(); render(); } else playScale(); break;
    case "drone": UI.withDrone=!UI.withDrone; if(UI.withDrone) droneOn(UI.root); else droneOff(); render(); break;
    case "pickday": UI.view=+ds.i; stopTimer(); render(); break;
    case "wk": UI.view=Math.min(363,Math.max(0,(UI.view||0)+7*(+ds.d))); stopTimer(); render(); window.scrollTo(0,0); break;
    case "gotoscale": { const x=SCALE_OF[ds.x]; UI.tab="oido"; UI.res.tab=null; if(x==="hold") UI.lab="hold"; else { UI.lab="esc"; UI.scale=x; } if(ds.x==="bordon") UI.withDrone=false; render(); window.scrollTo(0,0); break; }
    case "micstart": micStart(ds.k); break;
    case "rootnudge": UI.root=Math.min(72,Math.max(43,UI.root+ +ds.n)); render(); tone(mf(UI.root),0,1); break;
    case "roottone": tone(mf(UI.root),0,1.4); break;
    case "micstop": micStop(); break;
    case "resclear": delete UI.res[ds.k]; render(); break;
    case "cat": UI.cat=ds.c; render(); break;
    case "reset":
      if(!UI.confirmReset){ UI.confirmReset=true; render(); setTimeout(()=>{UI.confirmReset=false; if(UI.tab==="prog") render();},5000); }
      else { S=freshState(); UI.confirmReset=false; UI.view=null; save(); render(); toast("Progreso borrado. Empezamos de cero (de verdad)."); }
      break;
  }
}
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  if (el.closest("summary")) e.preventDefault();
  act(el.dataset.a, el);
});
document.addEventListener("toggle", e=>{
  const k=e.target && e.target.dataset && e.target.dataset.k; if(!k) return;
  if (e.target.open) UI.openB.add(k); else UI.openB.delete(k);
}, true);
document.addEventListener("input", e=>{
  const r=e.target.dataset && e.target.dataset.r; if(!r) return;
  const v=e.target.value;
  if (r==="note"){ UI.note=+v; const nn=document.querySelector(".note-name"); if(nn) nn.textContent=mname(UI.note); }
  if (r==="root"){ UI.root=+v; if(UI.withDrone) droneOn(UI.root); { const cd=document.querySelector('[data-r="root"]').closest(".card"); cd.querySelector("p").innerHTML="Tónica: <b>"+mname(UI.root)+"</b> ("+mf(UI.root).toFixed(1)+" Hz)"; const sc=SCALES[UI.scale]; cd.querySelectorAll("#solf span").forEach((el,i)=>{ const sm=el.querySelector("small"); if(sm) sm.textContent=mname(UI.root+sc.st[i]); }); } }
  if (r==="bpm"){ UI.bpm=+v; const b=$("#bpmv"); if(b) b.textContent=v; }
});
document.addEventListener("change", e=>{
  const r=e.target.dataset && e.target.dataset.r; if(!r) return;
  const v=e.target.value;
  if (r==="note"){ playNote(); }
  if (r==="root"){ tone(mf(UI.root),0,1.2); }
  if (r==="scale"){ UI.scale=v; stopScale(); UI.res.tab=null; render(); }
  if (r==="dirn"){ UI.dirn=v; stopScale(); render(); }
  if (r==="file"){ const fl=e.target.files&&e.target.files[0], k=e.target.dataset.k; e.target.value=""; fromFile(fl,k); }
  if (r==="start" && v){ S.start=v; save(); UI.view=null; render(); }
});

/* ═════════ ARRANQUE ═════════ */
S = loadLocal() || freshState();
render();
initCloud();
</script>
