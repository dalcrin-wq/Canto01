:root{
  --bg:#f6f1ea; --card:#fffaf3; --line:#ddd2c3; --txt:#231a2b; --mut:#75677f; --dim:#a698b0;
  --acc:#d9432f; --onacc:#fff; --ok:#17995f; --mid:#b57a00; --bad:#c62828;
  --disp:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120e17; --card:#1b1522; --line:#31283d; --txt:#f2ecf7; --mut:#a498b5; --dim:#6c6180;
    --acc:#ff6a55; --onacc:#1a0f14; --ok:#3ddc97; --mid:#f5b83a; --bad:#ef5350; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120e17; --card:#1b1522; --line:#31283d; --txt:#f2ecf7; --mut:#a498b5; --dim:#6c6180;
  --acc:#ff6a55; --onacc:#1a0f14; --ok:#3ddc97; --mid:#f5b83a; --bad:#ef5350; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,label:focus-within{outline:2px solid var(--acc);outline-offset:3px;border-radius:12px}
.app{max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:14px 22px 22px}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.mark{font-family:var(--disp);font-weight:800;letter-spacing:.14em;font-size:15px;color:var(--mut);flex:1}
.ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.on{color:var(--acc)}
.kick{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
h1,h2{font-family:var(--disp);font-weight:800;line-height:.98;margin:8px 0 0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(46px,14vw,64px)}
h2{font-size:clamp(38px,11.5vw,50px)}
.lead{color:var(--mut);margin:14px 0 0;max-width:34ch}

/* inicio */
.home .hero{padding-top:7vh}
.plan{list-style:none;margin:30px 0 0;padding:0;border-top:1px solid var(--line)}
.plan li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px}
.plan i{font-style:normal;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.sp{flex:1;min-height:24px}
.go{display:block;width:100%;min-height:62px;border-radius:999px;background:var(--acc);color:var(--onacc);font-weight:700;font-size:17px;letter-spacing:.07em;text-transform:uppercase;transition:transform .12s,opacity .2s}
.go:active{transform:scale(.98)}
.go[disabled]{opacity:.38;cursor:default}
.go.soft{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.link{display:block;margin:14px auto 0;padding:8px 14px;color:var(--mut);font-size:15px;min-height:40px}
.week{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px;padding:0 4px}
.week div{display:grid;justify-items:center;gap:7px;font-size:12px;color:var(--dim);letter-spacing:.08em}
.week b{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line)}
.week .d b{background:var(--acc);box-shadow:none}
.week .r b{background:var(--dim);box-shadow:none;opacity:.5}
.week .t b{box-shadow:inset 0 0 0 2px var(--acc)}
.week .t{color:var(--txt)}
.streak{text-align:center;margin-top:16px;color:var(--mut);font-size:14px;min-height:20px}
.done-today{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:600;margin-top:22px}

/* sesión */
.seg{flex:1;display:flex;gap:5px}
.seg i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.seg i.on{background:var(--acc)}
.seg i.now{background:var(--txt)}
.play .mid{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:4vh}
.say{font-size:18.5px;line-height:1.4;margin:12px 0 0;max-width:36ch}
.stage{margin:20px 0 0;position:relative}
canvas.cv{width:100%;height:clamp(150px,27dvh,210px);display:block}
.out{margin-top:14px;min-height:76px}
.out .big{font-family:var(--disp);font-weight:800;font-size:40px;line-height:1}
.out .big small{font-family:var(--body);font-size:15px;font-weight:600;color:var(--mut);letter-spacing:.02em;margin-left:6px}
.out p{margin:6px 0 0;color:var(--mut);font-size:15.5px}
.bot{padding-top:16px}
.rounds{display:flex;gap:7px;justify-content:center;margin-bottom:14px;min-height:10px}
.rounds i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.rounds i.on{background:var(--acc)}
.mini{display:flex;justify-content:space-between;margin-top:6px}
.mini button,.mini label{padding:10px 4px;color:var(--mut);font-size:14.5px;min-height:44px;display:inline-flex;align-items:center}
.ghost{display:block;width:100%;min-height:48px;margin-top:8px;border-radius:999px;color:var(--mut);font-weight:600;font-size:16px}

/* anillo y respiración */
.ringwrap{display:grid;place-items:center;height:190px}
.ring{position:relative;width:170px;height:170px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:56px;font-variant-numeric:tabular-nums}
.ring.fin .fg{stroke:var(--ok)}
.breath{display:grid;place-items:center;height:190px;position:relative}
.breath>*{grid-area:1/1}
.breath .o{width:176px;height:176px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line)}
.breath .c{width:176px;height:176px;border-radius:50%;background:var(--acc);opacity:.16;transform:scale(.42)}
.breath .t{text-align:center;font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:.04em;position:relative}
.breath .t small{display:block;font-family:var(--body);font-size:15px;color:var(--mut);font-weight:600;letter-spacing:0}

/* rango */
.rng .note{font-family:var(--disp);font-weight:900;font-size:clamp(110px,36vw,150px);line-height:1;margin:18px 0 0;text-align:center;font-variant-numeric:tabular-nums}
.rng .hz{text-align:center;color:var(--mut);min-height:24px}
.stepper{display:flex;justify-content:center;gap:18px;align-items:center;margin-top:12px}
.stepper button{width:56px;height:56px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);font-size:26px;color:var(--txt)}
.stepper .ear{width:auto;padding:0 20px;border-radius:999px;font-size:15px;font-weight:600;color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.listen.live{color:var(--acc)}

/* hoja y aviso */
.sheet{position:fixed;inset:0;background:rgba(10,6,14,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.sheet .in{background:var(--bg);width:100%;max-width:460px;max-height:86dvh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--disp);font-weight:800;font-size:30px;margin:0 0 10px;line-height:1}
.sheet h4{margin:18px 0 4px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.sheet p,.sheet li{margin:4px 0;font-size:16px}
.sheet ol{padding-left:20px;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 0;border-bottom:1px solid var(--line);min-height:56px;font-size:16.5px}
.row span{color:var(--mut);font-size:14.5px}
.row.danger{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:15px;z-index:30;max-width:88vw;text-align:center}
.toast[hidden]{display:none}

/* fin */
.fin .tick{width:92px;height:92px;border-radius:50%;background:var(--acc);display:grid;place-items:center;margin-top:10vh}

 bostezo:{n:"Bostezo-suspiro",c:"Calentar",m:2,

 masaje:{n:"Soltar mandíbula, lengua y cuello",c:"Calentar",m:2,
  s:["Con las yemas, masajea 20 s las articulaciones de la mandíbula (delante de las orejas).","Saca la lengua hacia abajo y di «aaa» 5 veces sin que se tense la base.","Gira el cuello despacio y deja caer los hombros 3 veces."],

 resp:{n:"Respiración costal 4-4-8",c:"Aire y apoyo",m:3,
  s:["De pie, manos en las costillas bajas como un cinturón. Inhala 4 s por la nariz: las costillas se abren hacia los lados.","Sostén 4 s sin cerrar la garganta (como si fueras a decir «ah»).","Suelta 8 s con un «ssss» uniforme. 4 rondas."],

 straw:{n:"Pajita (SOVT)",c:"Calentar",m:4,

 hum:{n:"Hum en «m» y «ng»",c:"Calentar",m:3,

 sirena:{n:"Sirena vocal",c:"Calentar",m:3,

  t:"Tú, que eres bombero, ya sabes de sirenas. Ahora, que estén afinadas.",

  s:["Di «ha» sin empujar y cántalo: el sonido empieza sin golpe ni aire de más.","Compara con «ah» golpeado y con «hhha» aireado. Busca el punto medio.","5 notas, 3 repeticiones cada una, nota larga de 3 s."],

 stac:{n:"Staccato de apoyo",c:"Aire y apoyo",m:3,

 mdv:{n:"Messa di voce",c:"Aire y apoyo",m:4,

  t:"Es el ejercicio favorito de los profesores de ópera y el que más enseña sobre ti. Y sí, cuesta.",

 esc5:{n:"Escala de 5 notas",c:"Afinación",m:4,

 escmay:{n:"Escala mayor con solfeo",c:"Afinación",m:5,
  s:["En la app (Oído → Escalas) elige una nota de partida y activa el bordón.","Canta Do-Re-Mi-Fa-Sol-La-Si-Do y baja, nombrando las notas (do móvil: el Do es la nota de partida, sea cual sea).","Después cántala con «a», sin nombres."],

  t:"Es la escala de «no hay notas feas»: por eso la usan el pop y el blues. La autopista de la melodía.",

 menor:{n:"Escala menor y color",c:"Afinación",m:4,

  t:"Un semitono de diferencia y de repente suena a despedida en el aeropuerto.",

 bordon:{n:"Cantar contra un bordón",c:"Afinación",m:5,

 salt:{n:"Saltos limpios (audiación)",c:"Afinación",m:4,

  t:"Primero la oreja, luego la boca. Cantar sin oír antes es disparar a ciegas.",

 gliss:{n:"Glissando y aterrizaje",c:"Afinación",m:3,

 pecho:{n:"Voz de pecho: «mum» y «gug»",c:"Registros",m:4,

 cabeza:{n:"Voz de cabeza: «oo» ligero",c:"Registros",m:4,

  t:"Piensa en cantar «por encima de la cabeza», no «a golpe de cuello».",

 falsete:{n:"Falsete aireado → sólido",c:"Registros",m:4,

  t:"El falsete bien hecho no es un chillido: es un susurro con consistencia (y es una de las firmas de Sheeran).",

  p:["«hoo» aireado","Sólido, sirena","Frase de canción en falsete"]},
 pass:{n:"Cruzar el passaggio",c:"Registros",m:5,
  s:["Sirenas despacio de grave a agudo con «ng» o «gee». Localiza dónde la voz cambia o se rompe (en voces masculinas suele andar por Re4–Fa4; varía mucho).","Al acercarte, baja el volumen y deja pasar el sonido sin empujar.","3 sirenas, cada una con menos «salto» perceptible."],

 mix:{n:"Mezcla con «nay» / «gee»",c:"Registros",m:5,

  p:["5 notas con «nay»","Arpegio con «gee»","Frases de canción en mezcla suave"]},
 cry:{n:"Gemido (cry) y cierre suave",c:"Registros",m:4,
  s:["En una nota cómoda por debajo de tu cambio de registro, haz un gemido corto y suave, como un cachorro que se queja: «mmm…» o «ñññ…». Volumen bajo.","Busca que suene conectado, sin aire soplado, y que la nuez no suba: el sonido «cuelga» por detrás del paladar blando. Mantén 3 s.","Ábrelo a «no» o «nei» suave y sube de semitono en semitono mientras sea cómodo. Tope: 2–3 minutos seguidos."],
  t:"Es el «¡pero mamááá!…» a un tercio de volumen. Si suena precioso, lo estás haciendo mal; si suena a niño quejándose, vas bien.",
  w:"Es la postura que enseñan Estill y la Complete Vocal Technique (Sadolin) como «cry»: inclina el cartílago tiroides, estira y adelgaza las cuerdas y ayuda a cerrarlas sin subir la laringe. Hace de puente entre cabeza y pecho en la mezcla.",
  x:"Empujar o aguantar el aire para «sonar fuerte». La presión se nota en el abdomen, no en el cuello. Si el cuello se endurece, te duele o se te sube la nuez: menos volumen y para.",
  p:["Gemido en notas cómodas","Abierto a «no»/«nei», cruzando poco a poco","Gemido llevado a una frase corta de canción"]},
 afila:{n:"Afila el sonido pequeño",c:"Registros",m:5,
  s:["Parte del «sonido A»: la nota aguda cómoda, ligera y sin peso, como de coro. Si cuesta, empieza una cuarta más grave.","Pasa a una «ñññ» con la lengua pegada al paladar, sin presionar. La contrapresión ayuda a cerrar las cuerdas sin apretar el cuello.","Abre a «ÑEEE» burlón, de bruja de cuento. Debe ganar brillo, no volumen: por dentro es un alfiler, por fuera suena presente. Luego «nei» y «no»."],
  t:"Si al hacerlo pequeño se rompe la voz o te aprietas la garganta, no engordes el sonido: afila el que ya es fácil. Es la regla de oro de este ejercicio.",
  w:"Para vibrar rápido, las cuerdas deben vibrar con poca masa, y con poca masa hace falta poca presión de aire por debajo. Con menos presión no se dispara la musculatura del cuello. El brillo del twang hace que ese sonido pequeño se oiga grande desde fuera.",
  x:"Quedarte en la «voz fea» como destino. Es un andamio: úsalo 1–2 minutos, a volumen bajo, y relájalo hacia un sonido pop natural. Si duele, paras.",
  p:["«ñññ» → «ÑEEE» en una nota cómoda","«nei» y «no» subiendo de semitono","Palabras reales de una canción"]},
 vocales:{n:"Vocales puras del castellano",c:"Resonancia",m:4,

  t:"Ventaja de cantar en castellano: las vocales ya vienen limpias. Aprovecha, que a los ingleses les sobran diptongos.",

  x:"Diptongar al final («aaay»). Congela la vocal.",
  p:["Una nota fija","Escala de 5 notas por vocal","Frases sobre vocales alternas"]},
 mascara:{n:"Resonancia al frente (máscara)",c:"Resonancia",m:4,
  s:["Hum con «m» y notando cosquillas en la cara.","Abre a «ma-me-mi-mo-mu» manteniendo esa vibración.","Escala de 5 notas con «ma» buscando el mismo cosquilleo."],

  w:"La sensación de vibración en la cara indica que el sonido tiene armónicos agudos con energía: más brillo con menos esfuerzo.",
  x:"Empujar la voz hacia la nariz. No es nasal, es adelantada.",
  p:["Hum y «ma»","Escala con «ma-me-mi»","Frases de canción con foco adelantado"]},
 twang:{n:"Twang «nyah»",c:"Resonancia",m:4,
  s:["Imita el «¡nyah!» de una bruja de cuento, sin gritar: nariz arrugada, sonido brillante.","Cántalo en una nota media y en una escala de 5 notas.","Reduce el volumen manteniendo el brillo."],
  t:"El twang es brillo sin volumen: da proyección a un cantante de balada sin que tenga que gritar.",
  w:"Estrechar el epiglotis-tubo crea un formante en torno a 2–4 kHz, justo donde el oído es más sensible. Más presencia con menos presión.",
  x:"Confundir twang con tensión o con gritar. Se busca brillo a volumen bajo; si sale ronco o te pica la garganta, baja el volumen y para. Es eficiente, no mágico: sigue habiendo trabajo muscular.",
  p:["«nyah» fijo","Escala de 5 notas","Frase de canción con twang suave"]},
 cover:{n:"Abrir y oscurecer",c:"Resonancia",m:4,
  s:["Canta una frase con vocal «a» y brillante, luego la misma con «o» ancha y oscura.","Alterna: brillante-oscuro-brillante.","Escucha cómo cambia el color sin cambiar de nota."],
  t:"Tener dos colores en la paleta es lo que separa a un cantante de uno que canta.",
  w:"Bajar la laringe y ensanchar la faringe alarga el tubo y baja los formantes: sonido más oscuro y redondo.",
  x:"Oscurecer apretando la garganta. Se oscurece abriendo, no tapando.",
  p:["Frase corta, 2 colores","Frase entera, 3 colores","Alterna color dentro de la misma frase"]},

function todayIdx(){ const t=new Date(); t.setHours(0,0,0,0); return Math.round((t-parseYmd(S.start))/DAY); }
function pickWarm(ph, wi, dow){
  const pool = ph===0 ? ["bostezo","masaje","resp"] : ["straw","trino","hum","sirena"];
  return pick(pool, wi*7+dow);
}
function buildDay(idx){
  const wi=Math.floor(idx/7), dow=idx%7, w=wi+1, wk=W[wi], K=wk[2], ph=phaseOf(w);
  const warmPool = ph===0 ? ["bostezo","masaje","resp"] : ["straw","trino","hum","sirena"];
  let warm=pickWarm(ph,wi,dow); if(K.includes(warm)) warm=pick(warmPool,wi*7+dow+1);
  const drill = ph===0 ? pick(["nota","nota","esc5"],wi+dow) : pick(["esc5","bordon","esc5","salt","nota"],wi+dow);
  const B=[], used=new Set();
  const add=(ex,core)=>{ if(used.has(ex)) return; used.add(ex); B.push({ex,core}); };
  if(dow===6){ add("straw",true); add("escucha",true); add("enfri",true); }
  else {
    add(warm,true);
    if(dow===0){ add(K[0],true); add(K[1],false); }
    if(dow===1){ add(drill,true); add(K[1],false); }
    if(dow===2){ add(K[0],true); add(K[2],false); }
    if(dow===3){ add(K[1],true); add(drill,false); }
    if(dow===4){ add(K[2],true); add(K[0],false); }
    if(dow===5){ add(K[0],true); add((w%4===0)?"rec":"song",true); }
    add("enfri",true);
  }
  const ci=B.findIndex(b=>b.ex==="enfri"); if(ci>=0 && ci!==B.length-1) B.push(B.splice(ci,1)[0]);
  const p=PHASES[ph], r=(w-p.a)/(p.b-p.a+1), lvl=r<.34?0:(r<.67?1:2);
  return {idx,w,wi,dow,ph,lvl,title:wk[0],focus:wk[1],blocks:B};
}
function planFor(idx, short){
  const day=buildDay(Math.min(Math.max(idx,0),363));
  const all=day.blocks.map(b=>b.ex);
  const core=day.blocks.filter(b=>b.core).map(b=>b.ex);
  const ids=(short||day.w<=2)?core:all;
  return {day, ids, hasShort: !(day.w<=2) && core.length<all.length, shortMin: core.reduce((s,id)=>s+E[id].m,0)};
}
const minsOf = ids => ids.reduce((s,id)=>s+E[id].m,0);
function dayOk(i){ const d=S.days[i]; return !!(d&&(d.done||d.rest)); }
function streak(){

}

let AC=null, masterG=null;

}
function tone(freq, when, dur, vol){

}
let drone=null;
function droneOn(m){
  droneOff(); const a=ac(); if(!a) return;
  const g=a.createGain(); g.gain.value=0; g.connect(masterG);
  const os=[mf(m-12),mf(m-12+7)].map((f,i)=>{ const o=a.createOscillator(); o.type="triangle"; o.frequency.value=f; const og=a.createGain(); og.gain.value=i?.5:1; o.connect(og); og.connect(g); o.start(); return o; });

}
function droneOff(){
  if(!drone||!AC){ drone=null; return; }
  const {g,os}=drone; try{ g.gain.cancelScheduledValues(AC.currentTime); g.gain.linearRampToValueAtTime(.0001,AC.currentTime+.25); }catch(e){}
  setTimeout(()=>os.forEach(o=>{try{o.stop();}catch(e){}}),300); drone=null;
}
/* Voz sintética: diente de sierra + formantes de vocal (hombre). No es una voz real: es un modelo del sonido que buscas. */
const FORM = { a:[[730,1],[1090,.7],[2440,.35]], e:[[530,1],[1840,.7],[2480,.35]], i:[[270,1],[2290,.55],[3010,.3]], o:[[570,1],[840,.8],[2410,.25]], u:[[300,1],[870,.6],[2240,.2]], m:[[250,1],[1100,.12],[2300,.05]] };
function vowelOf(s){
  const k=String(s||"a").toLowerCase().replace(/[^a-z]/g,"");
  if(/^(mm|ng|m|n)$/.test(k)) return "m";
  if(/^(a|ha|ah|la|nyah|fa)$/.test(k)) return "a";
  if(/^(e|re|nay|ey)$/.test(k)) return "e";
  if(/^(i|mi|si|gee|ee)$/.test(k)) return "i";
  if(/^(o|do|sol|mum|gug)$/.test(k)) return "o";
  if(/^(u|oo|uu|brr)$/.test(k)) return "u";
  return "a";
}
/* pts: [{m,t}] (t en segundos desde el inicio de la nota); o: {v, vib, trill, twang, swell} */
function singPath(pts, when, o, ctx, dest){
  ctx=ctx||ac(); if(!ctx) return; dest=dest||masterG; o=o||{};
  const t0=ctx.currentTime+when, dur=pts[pts.length-1].t;
  const osc=ctx.createOscillator(); osc.type="sawtooth";
  osc.frequency.setValueAtTime(mf(pts[0].m),t0);
  for(let i=1;i<pts.length;i++){
    if(pts[i].m===pts[i-1].m) osc.frequency.setValueAtTime(mf(pts[i].m),t0+pts[i].t);
    else osc.frequency.exponentialRampToValueAtTime(mf(pts[i].m),t0+pts[i].t);
  }
  const out=ctx.createGain(); out.gain.value=0; out.connect(dest);
  const vw=o.v||"a", F=FORM[vw]||FORM.a, sum=ctx.createGain(); sum.gain.value=vw==="m"?1.1:1;
  F.forEach(([fr,amp])=>{ const bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=fr; bp.Q.value=7; const g=ctx.createGain(); g.gain.value=amp*3.2; osc.connect(bp); bp.connect(g); g.connect(sum); });
  if(o.twang){ const bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2800; bp.Q.value=4; const g=ctx.createGain(); g.gain.value=2.2; osc.connect(bp); bp.connect(g); g.connect(sum); }
  let node=sum;
  if(vw==="m"){ const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900; sum.connect(lp); node=lp; }
  node.connect(out);
  const starts=[osc];
  if(o.vib){ const lfo=ctx.createOscillator(); lfo.frequency.value=5.3; const lg=ctx.createGain(); lg.gain.setValueAtTime(0,t0); lg.gain.linearRampToValueAtTime(mf(pts[0].m)*.013,t0+Math.min(1.4,dur*.6)); lfo.connect(lg); lg.connect(osc.frequency); starts.push(lfo); }
  if(o.trill){ const lfo=ctx.createOscillator(); lfo.frequency.value=22; const lg=ctx.createGain(); lg.gain.value=.35; const base=ctx.createGain(); base.gain.value=.65; lfo.connect(lg); lg.connect(base.gain); out.disconnect(); out.connect(base); base.connect(dest); starts.push(lfo); }
  const peak=.26, g=out.gain;
  g.setValueAtTime(.0001,t0); g.linearRampToValueAtTime(o.swell?peak*.25:peak,t0+.07);
  if(o.swell){ g.linearRampToValueAtTime(peak*1.1,t0+dur*.5); g.linearRampToValueAtTime(peak*.2,t0+dur-.1); }
  else g.setValueAtTime(peak,t0+Math.max(.08,dur-.12));
  g.linearRampToValueAtTime(.0001,t0+dur);
  starts.forEach(n=>{ n.start(t0); n.stop(t0+dur+.08); });
}

function toMono11k(data, fs){
  const f=Math.max(1,Math.round(fs/11025)), n=Math.floor(data.length/f), out=new Float32Array(n);

function yinFrame(x, off, W, tauMax, tauMin, fs){

  for(let tau=1;tau<=tauMax;tau++){ run+=d[tau]; c[tau]=run>0?d[tau]*tau/run:1; }

  for(let t=tauMin;t<=tauMax;t++){ if(c[t]<0.15){ while(t+1<=tauMax&&c[t+1]<c[t]) t++; tau=t; break; } }

}
function yinParams(f2){ return {W:Math.round(f2*0.07), tauMax:Math.round(f2/70), tauMin:Math.floor(f2/900), hop:Math.round(f2*0.023)}; }

    const y=yinFrame(x,off,P.W,P.tauMax,P.tauMin,f2);
    frames.push({t,m:y?69+12*Math.log2(y.f/440):null});
  }
  const ms=frames.map(f=>f.m);
  frames.forEach((f,i)=>{ if(f.m==null) return; const w=[]; for(let k=-2;k<=2;k++){ const v=ms[i+k]; if(v!=null&&Math.abs(v-f.m)<1.5) w.push(v); } if(w.length>=3){ w.sort((a,b)=>a-b); f.m=w[w.length>>1]; } else f.m=null; });

function medianOf(a){ const b=a.slice().sort((x,y)=>x-y); return b[b.length>>1]; }

    gap=0;

function alignSeq(segM, tgt){

  for(let j=1;j<=m;j++){ D[0][j]=j*SKT; B[0][j]=1; }
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++){
    const sub=D[i-1][j-1]+Math.min(Math.abs(segM[i-1]-tgt[j-1])*100,450), sT=D[i][j-1]+SKT, sS=D[i-1][j]+SKS;

  let slope=0; if(got.length>=4){ const mx=(got.length-1)/2, my=errs.reduce((a,b)=>a+b,0)/errs.length; let nu=0,de=0; errs.forEach((e,i)=>{ nu+=(i-mx)*(e-my); de+=(i-mx)*(i-mx); }); slope=nu/de; }
  return {kind:"scale",name:nm||SCALES[UI.scale].n,notes,n:notes.length,got:got.length,avg,ok,bias,spread,slope,frames:tr.frames,dt:tr.dt,T};
}
function evalHold(tr, note){
  const vs=tr.frames.filter(f=>f.m!=null);
  const med=medianOf(vs.map(f=>f.m)); const shift=Math.round((med-note)/12)*12, t=note+shift;
  let sel=vs.filter(f=>Math.abs(f.m-med)<1.5);
  if(sel.length*tr.dt<0.8) return {err:"No he oído una nota sostenida. Necesito al menos 1 s de nota estable (mejor 4–6 s)."};
  sel=sel.slice(Math.floor(sel.length*.1),Math.ceil(sel.length*.9));
  const errs=sel.map(f=>(f.m-t)*100), n=errs.length, mean=errs.reduce((a,b)=>a+b,0)/n;
  const sd=Math.sqrt(errs.reduce((s,e)=>s+(e-mean)*(e-mean),0)/n), bias=medianOf(errs);
  const avg=errs.reduce((s,e)=>s+Math.abs(e),0)/n, ok=errs.filter(e=>Math.abs(e)<=25).length;
  const mt=sel.reduce((s,f)=>s+f.t,0)/n; let nu=0,de=0; sel.forEach((f,i)=>{ nu+=(f.t-mt)*(errs[i]-mean); de+=(f.t-mt)*(f.t-mt); });
  const slope=de>0?nu/de:0;
  return {kind:"hold",name:mname(note),n,ok,avg,bias,sd,spread:sd,slope,frames:tr.frames,dt:tr.dt,T:[t],dur:n*tr.dt};
}

function buildTips(r){
  const tips=[]; const A=Math.round(r.avg);
  if(r.kind!=="hold"){
    tips.push(r.avg<=12?{h:"Veredicto",b:"Media de ±"+A+" ¢. Eso es afinación de estudio. Si esto fuera un bombero, sería de los que clavan el nudo a la primera."}
      :r.avg<=25?{h:"Veredicto",b:"Media de ±"+A+" ¢. Buena base: dentro del margen que tolera cualquier oído. Ahora a pulir las notas que se escapan."}
      :r.avg<=45?{h:"Veredicto",b:"Media de ±"+A+" ¢. Vas en camino: tu oído ya sabe dónde está la nota, la garganta aún está negociando. Repite con bordón."}
      :{h:"Veredicto",b:"Media de ±"+A+" ¢. Aún hay trabajo: toca más Oído (cents e intervalos) y cantar cada nota despacio sobre el bordón. Mide la mejora, no la perfección."});
    if(r.kind==="scale"&&r.got<r.n) tips.push({h:"Notas no detectadas",b:"No he encontrado "+(r.n-r.got)+" de "+r.n+" notas. Cántalas más largas (0,5 s), con el aire constante, y sin deslizar de una a otra."});
  } else {
    tips.push(r.sd<=12?{h:"Veredicto",b:"Nota firme: dispersión de "+Math.round(r.sd)+" ¢. Más estable que un trípode de bomberos."}
      :r.sd<=25?{h:"Veredicto",b:"Nota razonablemente estable ("+Math.round(r.sd)+" ¢ de dispersión). Con más apoyo constante, mejora."}
      :{h:"Veredicto",b:"Nota inestable ("+Math.round(r.sd)+" ¢ de dispersión). Es la señal clásica de presión de aire irregular: vuelve a respiración 4-4-8 y messa di voce."});
  }
  if(r.kind==="scale" && Math.abs(r.bias)>20 && r.spread<18){
    tips.push({h:"Tonalidad desplazada",b:"Tus intervalos son coherentes entre sí (dispersión "+Math.round(r.spread)+" ¢), pero toda la escala quedó "+Math.abs(Math.round(r.bias))+" ¢ "+(r.bias<0?"por debajo":"por encima")+". Es normal sin referencia: escucha la tónica y cántala antes de arrancar.",k:"t"});
  } else if(r.bias<-20){
    tips.push({h:"Tiendes a quedarte bajo ("+Math.round(r.bias)+" ¢)",b:"Suele ser falta de apoyo o miedo a la nota alta. Imagina la nota un pelín por encima, abre el paladar (bostezo) y sostén el aire. Piensa en «subir a buscarla», no en «llegar a duras penas».",k:"w"});
  } else if(r.bias>20){
    tips.push({h:"Tiendes a pasarte (+"+Math.round(r.bias)+" ¢)",b:"Suele ser exceso de presión o tensión de mandíbula y lengua. Menos volumen, más aire fluido, mandíbula suelta. La nota no se consigue empujando.",k:"w"});
  } else {
    tips.push({h:"Sin sesgo",b:"No cantas sistemáticamente ni alto ni bajo ("+(r.bias>0?"+":"")+Math.round(r.bias)+" ¢). Buen centro de gravedad.",k:"t"});
  }
  if(r.kind!=="hold"){
    if(r.slope<-6) tips.push({h:"Se te cae la afinación",b:"Vas bajando "+Math.abs(Math.round(r.slope))+" ¢ por nota a lo largo de la escala: es el aire que se acaba. Respira antes y reparte la columna de aire.",k:"w"});
    if(r.slope>6) tips.push({h:"Te vas emocionando",b:"Subes "+Math.round(r.slope)+" ¢ por nota: te aprieta la tensión conforme avanzas. Suelta la mandíbula en las notas altas.",k:"w"});
    const worst=r.notes.filter(n=>!n.miss).sort((a,b)=>Math.abs(b.err)-Math.abs(a.err))[0];
    if(worst) tips.push({h:"La más rebelde",b:worst.lb+" ("+(worst.err>0?"+":"")+Math.round(worst.err)+" ¢). Repite sobre el bordón solo esa nota, tres veces."});
  } else if(Math.abs(r.slope)>10){
    tips.push({h:"Deriva",b:"Tu nota "+(r.slope<0?"baja":"sube")+" unos "+Math.abs(Math.round(r.slope))+" ¢ por segundo. Mantener la nota quieta es el ejercicio más honesto que hay.",k:"w"});
  }
  return tips;
}

function evalFree(tr){
  const segs=segments(tr.frames,tr.dt);
  if(!segs.length) return {err:"No he encontrado notas estables (necesito tramos de al menos 0,15 s sin deslizar). En glissandos y sirenas es normal: aquí se mide cuando sostienes una nota."};
  const notes=segs.map(s=>{ const rm=Math.round(s.m); return {t:rm,lb:mname(rm),m:s.m,err:(s.m-rm)*100,sd:s.sd}; });
  const errs=notes.map(n=>n.err), bias=medianOf(errs), avg=errs.reduce((s,e)=>s+Math.abs(e),0)/errs.length;
  const ok=notes.filter(n=>Math.abs(n.err)<=25).length, spread=notes.reduce((s,n)=>s+Math.abs(n.err-bias),0)/notes.length;
  return {kind:"free",name:"toma libre",notes,n:notes.length,got:notes.length,avg,ok,bias,spread,slope:0,frames:tr.frames,dt:tr.dt,T:Array.from(new Set(notes.map(n=>n.t)))};
}


/* ═════════ MICRO EN DIRECTO ═════════ */
const Mic = {
  stream:null, src:null, proc:null, z:null, on:false, chunks:[], tail:new Float32Array(4096), fs:44100, from:0, trail:[], cb:null,
  async open(){
    if(this.stream) return;
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)) throw new Error("sin API");
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const a=ac(); if(!a){ stream.getTracks().forEach(t=>t.stop()); throw new Error("sin audio"); }
    this.stream=stream; this.fs=a.sampleRate; this.src=a.createMediaStreamSource(stream);
    this.proc=a.createScriptProcessor(2048,1,1); this.z=a.createGain(); this.z.gain.value=0;
    this.proc.onaudioprocess=ev=>this.chunk(ev);
    this.src.connect(this.proc); this.proc.connect(this.z); this.z.connect(a.destination);
  },
  chunk(ev){
    if(!this.on && !this.cb) return;
    const a=AC; if(!a) return; const inp=ev.inputBuffer.getChannelData(0), T=this.tail;
    T.copyWithin(0,inp.length); T.set(inp.subarray(Math.max(0,inp.length-T.length)),T.length-Math.min(inp.length,T.length));
    const t=a.currentTime-this.from;
    if(this.on && t>-0.35) this.chunks.push(new Float32Array(inp));
    const {x,fs:f2}=toMono11k(T,this.fs), P=yinParams(f2), N=P.W+P.tauMax+1; if(x.length<N) return;
    let r=0; for(let j=x.length-P.W;j<x.length;j++) r+=x[j]*x[j]; r=Math.sqrt(r/P.W);
    const y=r>=0.008?yinFrame(x,x.length-N,P.W,P.tauMax,P.tauMin,f2):null;
    const m=y?69+12*Math.log2(y.f/440):null;
    if(this.on && t>=-0.05) this.trail.push({t,m});
    if(this.cb) this.cb(m,y&&y.f);
  },
  begin(from){ this.chunks=[]; this.trail=[]; this.from=from; this.on=true; },
  end(){
    this.on=false; let n=0; this.chunks.forEach(c=>n+=c.length);
    const data=new Float32Array(n); let o=0; this.chunks.forEach(c=>{ data.set(c,o); o+=c.length; }); this.chunks=[]; return data;
  },
  close(){
    this.on=false; this.cb=null;
    try{ if(this.proc){ this.proc.onaudioprocess=null; this.src.disconnect(); this.proc.disconnect(); this.z.disconnect(); } if(this.stream) this.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
    this.stream=null; this.src=null; this.proc=null; this.z=null;
  }
};

/* ═════════ PATRONES ADAPTADOS A TU VOZ ═════════ */
const rng = () => ({ lo: S.lo==null?45:S.lo, hi: S.hi==null?62:S.hi });
function zoneStart(z, span){
  const {lo,hi}=rng(); let s;
  if(z==="low") s=lo+1;
  else if(z==="mid") s=Math.round((lo+hi)/2 - span/2);
  else if(z==="top") s=hi-span;
  else if(z==="cross") return hi-Math.round(span*.6);
  else return hi+2;
  return Math.max(lo-2, Math.min(s, hi+1-span));
}
function shapeOf(id){
  const x=X[id], {lo,hi}=rng(); let offs=[], syls=[], T=[], path=null, span=0, total=0;
  const gap = x.gap!=null ? x.gap : .08;
  if(x.t==="gl"){
    const R=Math.min(17, Math.max(8, hi-lo+3));
    path=x.p.map(([s,t])=>[s==="R"?R:s, t]);
    span=Math.max(...path.map(p=>p[0])); total=path[path.length-1][1];
  } else {
    if(x.t==="sc"){ const sc=SCALES[x.sc]; offs=sc.st.slice(); syls=x.syl==="solfa"?sc.lb.slice():offs.map(()=>x.syl); }
    else if(x.t==="pat"){ offs=x.n.slice(); syls=x.syls?x.syls.slice():offs.map(()=>x.syl); }
    else { offs=[0]; syls=[x.syl]; }
    let t=0; offs.forEach((o,i)=>{ const d=x.t==="hold"?x.dur:x.d; T.push({off:o,t0:t,d,syl:syls[i]}); t+=d+gap; });
    total=t-gap; span=Math.max(...offs);
  }
  return {x,T,path,span,total};
}
function maxShift(id){
  const sh=shapeOf(id), x=sh.x, base=zoneStart(x.z,sh.span);
  if(x.z==="cross"||x.z==="head") return 2;
  return Math.max(0, rng().hi+1-(base+sh.span));
}
function roundsOf(id){ return Math.max(1, Math.min(X[id].rounds||3, 1+maxShift(id))); }
function planOf(id, round){
  const sh=shapeOf(id), x=sh.x, base=zoneStart(x.z,sh.span), root=base+Math.min(round,maxShift(id));
  return {
    id, x, root, total:sh.total, an:x.an||(x.t==="hold"?"hold":"scale"),
    targets: sh.T.map(n=>({m:root+n.off,t0:n.t0,d:n.d,syl:n.syl})),
    path: sh.path ? sh.path.map(([s,t])=>({m:root+s,t})) : null
  };
}

  if(UI.sheet==="menu"){
    const {lo,hi}=rng(), set=S.lo!=null;
    const r=(a,t,s,cls)=>`<button class="row ${cls||""}" data-a="${a}">${t}<span>${s||""}</span></button>`;
    return `<div class="in"><h3>Ajustes</h3>
      ${r("recal","Mi voz",set?mname(lo)+" – "+mname(hi):"Sin medir")}
      ${r("voice2","Voz guía",S.voice?"Activada":"Silenciada")}
      ${r("rest","Hoy descanso","Mantiene la racha")}
      ${r("restart",UI.confirm==="restart"?"¿Seguro? Pulsa otra vez":"Empezar el año hoy","El día 1 pasa a ser hoy")}
      ${r("wipe",UI.confirm==="wipe"?"¿Seguro? Pulsa otra vez":"Borrar todo el progreso","","danger")}
      <button class="ghost" data-a="close" style="margin-top:14px">Cerrar</button></div>`;
  }
  const e=E[UI.sheet], lvl=buildDay(Math.min(Math.max(todayIdx(),0),363)).lvl;
  return `<div class="in"><h3>${esc(e.n)}</h3>
    <h4>Cómo</h4><ol>${e.s.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    <h4>Truco</h4><p>${esc(e.t)}</p>
    <h4>Por qué funciona</h4><p>${esc(e.w)}</p>
    <h4>Evita</h4><p>${esc(e.x)}</p>
    ${e.p?`<h4>Nivel de esta fase</h4><p>${esc(e.p[lvl])}</p>`:""}
    <button class="ghost" data-a="close" style="margin-top:14px">Cerrar</button></div>`;
}
function showSheet(v){ UI.sheet=v; const el=$("#sheet"); el.innerHTML=sheetHTML(); el.hidden=!v; }

/* ═════════ DIBUJO DEL ESCENARIO (notas objetivo + tu voz) ═════════ */
function errC(plan, m){
  const ts=plan.path?plan.path.map(p=>p.m):plan.targets.map(t=>t.m); let e=1e9;
  ts.forEach(t=>{ const d=((m-t+6)%12+12)%12-6; e=Math.min(e,Math.abs(d)*100); }); return e;
}
function drawStage(){
  const cv=document.getElementById("cv"), pl=UI.pl; if(!cv||!pl||!pl.plan) return;
  const plan=pl.plan, dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight; if(!w) return;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  const cs=getComputedStyle(document.documentElement), col=n=>cs.getPropertyValue(n).trim();
  const ms=plan.path?plan.path.map(p=>p.m):plan.targets.map(t=>t.m);
  let lo=Math.min(...ms)-2.5, hi=Math.max(...ms)+2.5; if(hi-lo<9){ const mid=(hi+lo)/2; lo=mid-4.5; hi=mid+4.5; }
  const L=46,R=8,TP=8,BT=8, XX=t=>L+(t/plan.total)*(w-L-R), YY=m=>h-BT-(m-lo)/(hi-lo)*(h-TP-BT), ph=(h-TP-BT)/(hi-lo);
  let tg=null;
  if(UI.clock&&AC) tg=AC.currentTime-UI.clock.t0; else if(pl.phase==="rec"&&AC) tg=AC.currentTime-UI.go;
  c.font="600 11.5px Barlow, system-ui, sans-serif"; c.textBaseline="middle"; c.textAlign="right";
  const lines=new Set(plan.path?[plan.path[0].m,Math.max(...ms)]:ms.map(m=>m));
  lines.forEach(m=>{ c.strokeStyle=col("--line"); c.setLineDash([4,5]); c.lineWidth=1; c.beginPath(); c.moveTo(L,YY(m)); c.lineTo(w-R,YY(m)); c.stroke(); c.setLineDash([]); c.fillStyle=col("--mut"); c.fillText(mname(m),L-8,YY(m)); });
  const acc=col("--acc");
  const alpha=(a)=>{ c.globalAlpha=a; };
  if(plan.path){
    c.lineCap="round"; c.lineJoin="round"; c.lineWidth=Math.max(8,ph*.9);
    c.strokeStyle=acc; alpha(.28); c.beginPath(); plan.path.forEach((p,i)=>{ const px=XX(p.t),py=YY(p.m); i?c.lineTo(px,py):c.moveTo(px,py); }); c.stroke();
    if(tg!=null&&tg>0){ alpha(.85); c.beginPath(); let started=false;
      for(let i=0;i<plan.path.length;i++){ const p=plan.path[i]; if(p.t<=tg){ const px=XX(p.t),py=YY(p.m); started?c.lineTo(px,py):c.moveTo(px,py); started=true; }
        else { const q=plan.path[i-1]; if(q){ const f=(tg-q.t)/(p.t-q.t); c.lineTo(XX(tg),YY(q.m+(p.m-q.m)*f)); } break; } }
      c.stroke(); }
    alpha(1);
  } else {
    plan.targets.forEach(n=>{
      const x0=XX(n.t0), x1=XX(n.t0+n.d), bh=Math.max(10,ph*.8);
      const now=tg!=null&&tg>=n.t0&&tg<=n.t0+n.d, past=tg!=null&&tg>n.t0+n.d&&UI.clock;
      c.fillStyle=acc; alpha(now?.95:(past?.6:.34));
      const rw=Math.max(5,x1-x0), r=Math.min(5,bh/2,rw/2), y0=YY(n.m)-bh/2;
      c.beginPath(); c.moveTo(x0+r,y0); c.arcTo(x0+rw,y0,x0+rw,y0+bh,r); c.arcTo(x0+rw,y0+bh,x0,y0+bh,r); c.arcTo(x0,y0+bh,x0,y0,r); c.arcTo(x0,y0,x0+rw,y0,r); c.closePath(); c.fill(); alpha(1);
      if(rw>34 && n.syl && plan.targets.length<=9){ c.fillStyle=col("--txt"); c.textAlign="center"; alpha(.7); c.fillText(n.syl,x0+rw/2,y0+bh/2); alpha(1); c.textAlign="right"; }
    });
  }
  if(tg!=null&&tg>=0&&tg<=plan.total){ c.strokeStyle=col("--txt"); alpha(.35); c.lineWidth=1.5; c.beginPath(); c.moveTo(XX(tg),TP); c.lineTo(XX(tg),h-BT); c.stroke(); alpha(1); }
  if(pl.phase==="rec"&&tg!=null&&tg<0){ c.fillStyle=col("--mut"); c.textAlign="center"; c.font="600 14px Barlow, system-ui, sans-serif"; c.fillText(tg<-.55?"Escucha la nota…":"Ahora",w/2+L/2,TP+14); c.textAlign="right"; }
  const trail=pl.phase==="rec"?Mic.trail:UI.lastTrail;
  if(trail&&trail.length&&(pl.phase==="rec"||pl.phase==="res"||pl.phase==="anal")){
    const center=ms.reduce((a,b)=>a+b,0)/ms.length; const neutral=!pl.plan.x.fb;
    trail.forEach(p=>{
      if(p.m==null||p.t<0||p.t>plan.total+.6) return; let m=p.m; if(Math.abs(m-center)>8) m+=12*Math.round((center-m)/12);
      if(m<lo-1||m>hi+1) return; const e=errC(plan,m);
      c.fillStyle=neutral?col("--txt"):(e<=25?col("--ok"):(e<=50?col("--mid"):col("--bad"))); alpha(neutral?.7:1);
      c.beginPath(); c.arc(Math.min(XX(p.t),w-R),YY(m),3.1,0,6.283); c.fill(); alpha(1);
    });
    if(pl.phase==="rec"){ const last=trail[trail.length-1]; if(last&&last.m!=null&&performance.now()-(UI.lastPt||0)>=0){ let m=last.m; if(Math.abs(m-center)>8) m+=12*Math.round((center-m)/12); c.fillStyle=col("--txt"); c.textAlign="left"; c.font="700 13px Barlow, system-ui, sans-serif"; const px=Math.min(XX(Math.max(0,last.t)),w-R-34); c.fillText(mname(Math.round(m)),px+8,Math.max(TP+8,Math.min(h-BT-6,YY(m)-12))); c.textAlign="right"; } }
  }
}
function startAnim(){
  cancelAnimationFrame(UI.raf);
  const loop=()=>{
    const pl=UI.pl;
    if(UI.view==="play" && pl && pl.plan && (UI.clock||pl.phase==="rec")){ drawStage(); UI.raf=requestAnimationFrame(loop); } else UI.raf=0;
  };
  UI.raf=requestAnimationFrame(loop);
}

/* ═════════ EJEMPLO, TOMA Y ANÁLISIS ═════════ */
function playDemo(){
  const pl=UI.pl, plan=pl.plan; if(!plan) return; const a=ac(); if(!a) return;
  stopAll(); const x=plan.x, lead=.35;
  if(x.drone) droneOn(plan.root);
  const o={vib:x.vib,trill:x.trill,twang:x.twang,swell:x.swell};
  if(plan.path) singPath(plan.path.map(p=>({m:p.m,t:p.t})),lead,Object.assign({v:vowelOf(x.syl)},o));
  else plan.targets.forEach(n=>singPath([{m:n.m,t:0},{m:n.m,t:n.d}],lead+n.t0,Object.assign({v:vowelOf(n.syl)},o)));
  UI.clock={t0:a.currentTime+lead};
  pl.phase="demo"; render(); startAnim();
  UI.endT=setTimeout(()=>{ droneOff(); UI.clock=null; if(UI.pl===pl&&pl.phase==="demo"){ pl.phase="ready"; render(); } },(lead+plan.total+.6)*1000);
}
async function startTake(){
  const pl=UI.pl, plan=pl.plan; stopAll();
  try{ await Mic.open(); }catch(e){ UI.micBlocked=true; render(); toast("Aquí no puedo oír tu micro. Puedes seguir sin él."); return; }
  const a=ac(); tone(mf(plan.root),0,.9,.22);
  UI.go=a.currentTime+1.9; Mic.begin(UI.go); pl.phase="rec"; pl.res=null; UI.lastTrail=null; render(); startAnim();
  UI.endT=setTimeout(()=>endTake(),(1.9+plan.total+2.2)*1000);
}
function endTake(){
  const pl=UI.pl; if(!pl||pl.phase!=="rec") return; clearTimeout(UI.endT);
  const data=Mic.end(); UI.lastTrail=Mic.trail.slice(); const fs=Mic.fs;
  pl.phase="anal"; render();
  setTimeout(()=>{ let r; try{ r=analyze(data,fs,pl.plan); }catch(e){ r={err:"Algo falló al analizar el audio. Prueba con una toma más corta."}; } pl.res=r; pl.phase="res"; render(); },40);
}
function analyze(data, fs, plan){
  if(data.length>fs*45) data=data.subarray(0,Math.floor(fs*45));
  const tr=trackPitch(data,fs), vs=tr.frames.filter(f=>f.m!=null);
  if(vs.length*tr.dt<0.4) return {err:"Casi no te he oído. Acércate al micro, canta con algo más de volumen y en un sitio sin ruido."};
  if(!plan.x.fb) return {free:true};
  const r = plan.an==="hold" ? evalHold(tr,Math.round(plan.targets[0].m)) : evalScale(tr,plan.targets.map(t=>t.m),plan.targets.map(t=>mname(t.m)),E[plan.id].n);
  if(r.err) return r;
  r.tips=buildTips(r);
  S.takes.push({ts:Date.now(),id:plan.id,avg:Math.round(r.avg*10)/10,n:r.n}); if(S.takes.length>80) S.takes.splice(0,S.takes.length-80); save();
  return r;
}
async function fromFile(file){
  const pl=UI.pl; if(!file||!pl||!pl.plan) return; pl.phase="anal"; render();
  try{
    const buf=await file.arrayBuffer(), a=ac(); if(!a) throw new Error("sin audio");
    const ab=await new Promise((res,rej)=>{ const p=a.decodeAudioData(buf,res,rej); if(p&&p.catch) p.catch(rej); });
    const n=ab.length, mono=new Float32Array(n);
    for(let c=0;c<ab.numberOfChannels;c++){ const d=ab.getChannelData(c); for(let i=0;i<n;i++) mono[i]+=d[i]/ab.numberOfChannels; }
    setTimeout(()=>{ let r; try{ r=analyze(mono,ab.sampleRate,pl.plan); }catch(e){ r={err:"No he podido analizar ese audio."}; } pl.res=r; pl.phase="res"; UI.lastTrail=null; render(); },40);
  }catch(e){ pl.res={err:"No he podido leer ese audio. Prueba con una grabación de la grabadora de voz (m4a, mp3 o wav)."}; pl.phase="res"; render(); }
}

/* ═════════ RESPIRACIÓN Y PASOS CON TEMPORIZADOR ═════════ */
function startBreath(){
  const pl=UI.pl; stopAll(); pl.phase="breath"; render();
  const P=pl.brP, names=["Inhala","Sostén","Suelta"], seq=[]; for(let r=0;r<4;r++) P.forEach((s,i)=>{ if(s>0) seq.push({name:names[i],s,k:i,r}); });
  let at=0;
  seq.forEach((st,i)=>{
    UI.btimers.push(setTimeout(()=>{ UI.brS={name:st.name,k:st.k,s:st.s,t0:performance.now(),r:st.r}; say(st.name); },at*1000));
    at+=st.s;
  });
  UI.btimers.push(setTimeout(()=>{ UI.brS=null; pl.phase="breathdone"; tone(mf(84),0,.4,.1); render(); },at*1000+300));
  const loop=()=>{
    if(UI.view!=="play"||pl.phase!=="breath"){ return; }
    const s=UI.brS, c=document.getElementById("bc"), t=document.getElementById("bt");
    if(s&&c&&t){
      const p=Math.min(1,(performance.now()-s.t0)/(s.s*1000)); let sc=s.k===0?.42+.58*p:(s.k===1?1:1-.58*p);
      c.style.transform="scale("+sc.toFixed(3)+")"; c.style.opacity=(.16+.3*(sc-.42)/.58).toFixed(2);
      t.innerHTML=s.name+"<small>"+Math.max(1,Math.ceil(s.s*(1-p)))+" · ronda "+(s.r+1)+" de 4</small>";
    }
    UI.raf=requestAnimationFrame(loop);
  };
  UI.raf=requestAnimationFrame(loop);
}
function startGuide(){
  const pl=UI.pl, e=E[pl.id]; clearInterval(UI.gtimer);
  const secs=Math.max(20,Math.round(e.m*60/e.s.length)), end=Date.now()+secs*1000, C=339.3;
  const tick=()=>{
    const left=Math.max(0,Math.ceil((end-Date.now())/1000)), fg=document.getElementById("rfg"), n=document.getElementById("rn"), ring=document.getElementById("ring");
    if(!fg){ clearInterval(UI.gtimer); return; }
    fg.style.strokeDashoffset=(C*(1-left/secs)).toFixed(1); n.textContent=left>0?(left>=60?Math.floor(left/60)+":"+String(left%60).padStart(2,"0"):left):"✓";
    if(left===0){ ring.classList.add("fin"); clearInterval(UI.gtimer); tone(mf(84),0,.35,.1); }
  };
  UI.gtimer=setInterval(tick,250); tick();
}

/* ═════════ FLUJO DE LA SESIÓN ═════════ */
function beginSession(){
  const idx=todayIdx(), pf=planFor(idx,UI.short);
  UI.pl={ list:pf.ids, i:0, idx, lvl:pf.day.lvl, t0:Date.now(), skipped:0 };
  UI.view="play"; ac(); enterStep(); window.scrollTo(0,0);
}
function enterStep(){
  const pl=UI.pl; stopAll(); pl.id=pl.list[pl.i]; pl.round=0; pl.res=null; pl.gi=0; pl.plan=null; UI.lastTrail=null;
  if(X[pl.id]){ pl.plan=planOf(pl.id,0); pl.rounds=roundsOf(pl.id); pl.phase="listen"; render(); say(X[pl.id].say); }
  else if(pl.id==="resp"){ pl.brP=[[4,4,8],[4,4,12],[4,2,16]][pl.lvl]; pl.rounds=1; pl.phase="breath0"; render(); say("Manos en las costillas bajas. Inhala por la nariz, sostén y suelta con un siseo uniforme. Cuatro rondas."); }
  else { pl.rounds=1; pl.phase="guide"; render(); startGuide(); say(E[pl.id].s[0]); }
}
function nextEx(){
  const pl=UI.pl; pl.i++;
  if(pl.i>=pl.list.length) return finishSession();
  enterStep(); window.scrollTo(0,0);
}
function finishSession(){
  const pl=UI.pl; stopAll(); Mic.close();
  if(pl.skipped>=pl.list.length){ UI.view="home"; UI.pl=null; render(); return; }
  S.days[pl.idx]={done:true,mins:Math.max(1,Math.round((Date.now()-pl.t0)/60000))}; save();
  UI.doneN=streak(); UI.view="done"; UI.pl=null; render(); window.scrollTo(0,0);
}
function advance(){
  const pl=UI.pl;
  if(pl.plan && pl.round<pl.rounds-1){ pl.round++; pl.plan=planOf(pl.id,pl.round); pl.phase="ready"; pl.res=null; UI.lastTrail=null; render(); }
  else nextEx();
}
function primary(){
  const pl=UI.pl; if(!pl) return;
  switch(pl.phase){
    case "listen": playDemo(); break;
    case "ready": if(UI.micBlocked) advance(); else startTake(); break;
    case "rec": endTake(); break;
    case "res": advance(); break;
    case "guide":
      if(pl.gi<E[pl.id].s.length-1){ pl.gi++; render(); startGuide(); say(E[pl.id].s[pl.gi]); } else nextEx();
      break;
    case "breath0": startBreath(); break;
    case "breathdone": nextEx(); break;
  }
}
function secondary(){
  const pl=UI.pl; if(!pl) return;
  if(pl.phase==="ready") playDemo();
  else if(pl.phase==="res"){ pl.phase="ready"; pl.res=null; UI.lastTrail=null; render(); }
}

/* ═════════ RENDER ═════════ */
function render(){
  const el=$("#app");
  const v=UI.view;
  el.className="app "+v;
  el.innerHTML = v==="home"?viewHome() : v==="play"?viewPlay() : v==="range"?viewRange() : viewDone();
  if(v==="play"){
    const pl=UI.pl;
    if(pl.plan){ drawStage(); if(UI.clock||pl.phase==="rec") startAnim(); }
  }
}
function openRange(after){
  const {lo,hi}=rng(); UI.rg={step:0,m:S.lo==null?45:lo,lo:null,live:false,after}; UI.view="range"; Mic.cb=null; render();
}

/* ═════════ ACCIONES ═════════ */
function act(a, el){
  switch(a){
    case "go":
      if(S.lo==null||S.hi==null) openRange("go"); else beginSession();
      break;
    case "short": UI.short=!UI.short; render(); break;
    case "pri": primary(); break;
    case "sec": secondary(); break;
    case "skip": { const pl=UI.pl; pl.skipped++; nextEx(); break; }
    case "exit": stopAll(); Mic.close(); UI.pl=null; UI.view="home"; render(); break;
    case "voice": S.voice=!S.voice; save(); if(!S.voice) hush(); render(); break;
    case "more": showSheet(UI.pl.id); break;
    case "menu": UI.confirm=null; showSheet("menu"); break;
    case "close": UI.confirm=null; showSheet(null); break;
    case "voice2": S.voice=!S.voice; save(); if(!S.voice) hush(); showSheet("menu"); break;
    case "rest": S.days[todayIdx()]={rest:true}; save(); showSheet(null); render(); toast("Descanso anotado. La racha sigue viva."); break;
    case "recal": showSheet(null); openRange("home"); break;
    case "restart":
      if(UI.confirm!=="restart"){ UI.confirm="restart"; showSheet("menu"); break; }
      S.days={}; S.start=ymd(new Date(new Date().setHours(0,0,0,0))); S.startSet=true; save(); UI.confirm=null; showSheet(null); render(); toast("Hoy es el día 1."); break;
    case "wipe":
      if(UI.confirm!=="wipe"){ UI.confirm="wipe"; showSheet("menu"); break; }
      S=fresh(); save(); UI.confirm=null; showSheet(null); render(); toast("Progreso borrado."); break;
    case "home": UI.view="home"; render(); break;
    case "rgback": Mic.cb=null; Mic.close(); UI.view="home"; render(); break;
    case "rgdn": rgNote(UI.rg.m-1); tone(mf(UI.rg.m),0,.8); break;
    case "rgup": rgNote(UI.rg.m+1); tone(mf(UI.rg.m),0,.8); break;
    case "rgear": tone(mf(UI.rg.m),0,1.4); break;
    case "rglive": rgLive(); break;
    case "rgok": {
      const g=UI.rg; Mic.cb=null; Mic.close(); g.live=false;
      if(g.step===0){ g.lo=g.m; g.step=1; g.m=Math.min(84,g.lo+16); render(); break; }
      let hi=g.m, lo=g.lo; if(hi<lo+7){ hi=lo+7; toast("Tu rango es corto; lo amplío un poco para que los ejercicios quepan. Se ajustará con el tiempo."); }
      S.lo=lo; S.hi=hi; save();
      if(g.after==="go") beginSession(); else { UI.view="home"; render(); toast("Tu voz: "+mname(lo)+" – "+mname(hi)+". Todo se adapta a ese rango."); }
      break; }
  }
}
document.addEventListener("click",e=>{
  if(e.target.id==="sheet"){ UI.confirm=null; showSheet(null); return; }
  const el=e.target.closest("[data-a]"); if(!el||el.disabled) return;
  act(el.dataset.a,el);
});
document.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.r==="file"){ const f=e.target.files&&e.target.files[0]; e.target.value=""; fromFile(f); }
});
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&UI.view==="play"){ hush(); } });

/* ═════════ ARRANQUE ═════════ */
S = load() || fresh();
render();
initCloud();

</script>
